name: تجهيز بيئة التجريب لمرة واحدة (Bootstrap Staging)

# يُشغَّل يدوياً مرّة واحدة (Run workflow) لتجهيز بيئة التجريب المعزولة على الخادم:
# استنساخ المستودع في /root/trbhh-staging، توليد .env خاص (منفذ 3081 + قاعدة تجريب
# مستقلّة + سرّ جديد)، وتشغيل الحاويات (قاعدة + Redis + التطبيق) بمشروع Docker منفصل.
# معزول كلياً عن الإنتاج (أسماء/منفذ/قاعدة/حجوم مختلفة) ولا يلمس قاعدة الإنتاج.
# يبقى بعده خطوة واحدة يدوية في لوحة الخادم: ربط beta.trbhh.com ← 127.0.0.1:3081 + SSL + كلمة مرور.
on:
  workflow_dispatch:

concurrency:
  group: vps-deploy-staging
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: تجهيز الخادم عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
          PROD_DIR: ${{ secrets.PROD_DIR }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "❌ أسرار الخادم (VPS_HOST/VPS_USER/VPS_SSH_KEY) غير مكتملة."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          DIR="${STAGING_DIR:-/root/trbhh-staging}"
          PROD="${PROD_DIR:-/root/trbhh}"
          # سكربت التجهيز يُنفَّذ على الخادم. الكلمات/الأسرار تُولَّد على الخادم ولا تُطبع كاملة.
          REMOTE_CMD=$(cat <<REMOTE
          set -e
          echo "== تجهيز بيئة التجريب في $DIR =="
          if [ ! -d "$DIR/.git" ]; then
            ORIGIN=\$(cd "$PROD" && git remote get-url origin)
            echo "استنساخ من الأصل..."
            git clone "\$ORIGIN" "$DIR"
          fi
          cd "$DIR"
          git fetch origin staging
          git checkout -B staging origin/staging
          if [ ! -f .env ]; then
            echo "توليد .env للتجريب..."
            SECRET=\$(openssl rand -hex 32)
            DBPASS=\$(openssl rand -hex 16)
            DBROOT=\$(openssl rand -hex 16)
            {
              echo "APP_PORT=3081"
              echo "DB_NAME=trbhhdb"
              echo "DB_USER=trbhh"
              echo "DB_PASSWORD=\$DBPASS"
              echo "DB_ROOT_PASSWORD=\$DBROOT"
              echo "AUTH_SECRET=\$SECRET"
              echo "COOKIE_SECURE=true"
              echo "LEGACY_MEDIA_BASE="
              echo "LEGACY_LOCAL_DIR="
              echo "NEXT_PUBLIC_MEDIA_BASE="
            } > .env
            chmod 600 .env
          else
            echo ".env موجود — يُترك كما هو."
          fi
          echo "== تشغيل الحاويات (قد يستغرق البناء دقائق) =="
          docker compose --profile localdb -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build
          echo "== الحالة =="
          docker compose --profile localdb -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml ps
          echo "== كشف لوحة تحكّم الخادم (لأرشدك للخطوة الأخيرة) =="
          if command -v clpctl >/dev/null 2>&1; then echo "PANEL_DETECTED=CloudPanel"; fi
          if [ -d /www/server/panel ]; then echo "PANEL_DETECTED=aaPanel/BT"; fi
          if command -v caddy >/dev/null 2>&1; then echo "PANEL_DETECTED=Caddy"; fi
          if [ -d /etc/nginx ] && ! command -v clpctl >/dev/null 2>&1; then echo "NGINX_PRESENT=/etc/nginx"; fi
          echo "== المنافذ المستمعة (تأكيد أن 3081 يعمل) =="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ":(80|443|3080|3081)\b" || true
          echo "✅ التطبيق التجريبي يعمل داخلياً على 127.0.0.1:3081"
          echo "الخطوة الأخيرة (لوحتك): beta.trbhh.com ← Reverse Proxy إلى http://127.0.0.1:3081 + SSL + Basic Auth"
          REMOTE
          )
          n=0
          until [ "$n" -ge 4 ]; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                 -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_CMD"; then
              echo "✅ اكتمل تجهيز بيئة التجريب."
              exit 0
            fi
            n=$((n + 1))
            [ "$n" -lt 4 ] && { echo "⚠️ إعادة المحاولة $n/4 بعد $((n*20))s ..."; sleep $((n * 20)); }
          done
          echo "❌ فشل التجهيز عبر SSH."
          exit 1
