name: التقاط لقطات شاشة من trbhh.sa

# يلتقط لقطات حقيقية من trbhh.sa (التصميم الجديد) عبر متصفح يعمل على الخادم
# (لا بروكسي هناك)، بمقاسات متجر Play، ثم يرفعها كمخرجات (artifact) فقط — بلا كتابة
# في المستودع وبلا أي نشر. يعمل عند الدفع لفرع claude-capture-run أو يدوياً.
on:
  workflow_dispatch:
  push:
    branches: [claude-capture-run]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: التقاط عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o ServerAliveInterval=30 -i ~/.ssh/deploy_key -p $PORT"
          SCP_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -i ~/.ssh/deploy_key -P $PORT"

          echo "📦 تجهيز Playwright..."
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "npm i -g playwright@1.49.1 >/dev/null 2>&1; NODE_PATH=\$(npm root -g) npx --yes playwright@1.49.1 install --with-deps chromium"

          echo "📸 التقاط الصفحات..."
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE_SCRIPT'
          set -e
          rm -rf /root/sa-shots
          mkdir -p /root/sa-shots
          NODE_PATH="$(npm root -g)" node -e '
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const SITE = "https://trbhh.sa";
            const shotWith = async (ctx, prefix) => {
              const p = await ctx.newPage();
              const shot = async (url, name) => {
                try {
                  await p.goto(url, { waitUntil: "networkidle", timeout: 30000 });
                  await p.waitForTimeout(700);
                  await p.click("[aria-label=\"إغلاق\"]", { timeout: 1500 }).catch(() => {});
                  await p.waitForTimeout(500);
                  await p.screenshot({ path: `/root/sa-shots/${prefix}-${name}.png` });
                  console.log("OK", prefix, name, url);
                } catch (e) { console.log("SKIP", prefix, name, url, e.message); }
              };
              await shot(SITE + "/", "01-home");
              await shot(SITE + "/companies", "02-companies");
              await shot(SITE + "/deals", "03-deals");
              const adHref = await p.evaluate(() => {
                const a = document.querySelector("a[href*=\"/ads/\"]");
                return a ? a.getAttribute("href") : null;
              }).catch(() => null);
              if (adHref) await shot(new URL(adHref, SITE).href, "04-ad-detail");
              await p.close();
            };
            await shotWith(await b.newContext({
              viewport: { width: 412, height: 915 }, deviceScaleFactor: 3,
              userAgent: "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36",
            }), "phone");
            await shotWith(await b.newContext({
              viewport: { width: 800, height: 1280 }, deviceScaleFactor: 2,
              userAgent: "Mozilla/5.0 (Linux; Android 13; SM-T870) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
            }), "tablet");
            await b.close();
          })();
          '
          ls -la /root/sa-shots
          REMOTE_SCRIPT

          echo "📥 تنزيل الصور..."
          mkdir -p out
          scp $SCP_OPTS "$VPS_USER@$VPS_HOST:/root/sa-shots/*.png" out/
          ls -la out/

      - name: رفع الصور كمخرجات
        uses: actions/upload-artifact@v4
        with:
          name: trbhh-sa-play-screenshots
          path: out/*
          if-no-files-found: error
