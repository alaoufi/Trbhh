name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 33309:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      AUTH_SECRET: ci_only_auth_secret_0123456789abcdef0123456789abcdef
      DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci
    steps:
      - uses: actions/checkout@v4

      # لا تحدّد إصدار pnpm هنا — يُقرأ من حقل packageManager في package.json
      # (تحديده في الموضعين يسبّب ERR_PNPM_BAD_PM_VERSION ويُفشل الفحص).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # postinstall runs `prisma generate` — needs a placeholder URL only.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci

      - name: Create test database schema
        run: pnpm prisma db push --skip-generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Release backup and rollback safeguards
        run: |
          node --test scripts/release/*.test.cjs
          bash -n scripts/release/finance-backup.sh
          bash -n scripts/release/finance-deploy.sh
          bash -n scripts/release/finance-capture-job.sh

      - name: Authentication transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/integration/auth-mysql.test.ts --maxWorkers=1
        env:
          AUTH_DB_TESTS: '1'
          AUTH_TEST_DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci

      - name: Supplier selection transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/integration/supplier-selection-mysql.test.ts --maxWorkers=1
        env:
          AUTH_DB_TESTS: '1'
          AUTH_TEST_DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci

      - name: Supplier order and coordinator transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config vitest.suppliers.config.ts
        env:
          SUPPLIER_DB_TESTS: '1'
          SUPPLIER_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_supplier_test

      - name: RBAC transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config vitest.access-control.config.ts
        env:
          RBAC_DB_TESTS: '1'
          RBAC_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_rbac_test

      - name: Finance transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config vitest.finance.config.ts
        env:
          FINANCE_DB_TESTS: '1'
          FINANCE_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_finance_test

      - name: Commerce transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config vitest.commerce.config.ts
        env:
          COMMERCE_DB_TESTS: '1'
          COMMERCE_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_commerce_test

      - name: Store catalog transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run tests/integration/store-products-mysql.test.ts --maxWorkers=1
        env:
          AUTH_DB_TESTS: '1'
          AUTH_TEST_DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci
          STORE_DB_TESTS: '1'
          STORE_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_store_test

      - name: Category transactions on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config vitest.categories.config.ts
        env:
          CATEGORIES_DB_TESTS: '1'
          CATEGORIES_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_categories_test

      - name: Search visibility on isolated MySQL
        if: ${{ !cancelled() }}
        run: pnpm exec vitest run --config vitest.search.config.ts
        env:
          SEARCH_VISIBILITY_MYSQL: '1'
          SEARCH_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_search_visibility_test

      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm build
