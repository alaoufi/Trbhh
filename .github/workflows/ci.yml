name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 33309:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      AUTH_SECRET: ci_only_auth_secret_0123456789abcdef0123456789abcdef
      DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci
    steps:
      - uses: actions/checkout@v4

      # لا تحدّد إصدار pnpm هنا — يُقرأ من حقل packageManager في package.json
      # (تحديده في الموضعين يسبّب ERR_PNPM_BAD_PM_VERSION ويُفشل الفحص).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # postinstall runs `prisma generate` — needs a placeholder URL only.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci

      - name: Create test database schema
        run: pnpm prisma db push --skip-generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Authentication transactions on isolated MySQL
        run: pnpm exec vitest run tests/integration/auth-mysql.test.ts --maxWorkers=1
        env:
          AUTH_DB_TESTS: '1'
          AUTH_TEST_DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci

      - name: Supplier selection transactions on isolated MySQL
        run: pnpm exec vitest run tests/integration/supplier-selection-mysql.test.ts --maxWorkers=1
        env:
          AUTH_DB_TESTS: '1'
          AUTH_TEST_DATABASE_URL: mysql://ci:ci@127.0.0.1:33309/ci

      - name: Supplier order and coordinator transactions on isolated MySQL
        run: pnpm exec vitest run --config vitest.suppliers.config.ts
        env:
          SUPPLIER_DB_TESTS: '1'
          SUPPLIER_TEST_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_supplier_test

      - name: Production build
        run: pnpm build

      - name: Create isolated browser preview schema
        env:
          DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_commerce_preview_20260919
        run: |
          mysql -h127.0.0.1 -P33309 -uroot -pci_root_password -e "CREATE DATABASE trbhh_commerce_preview_20260919 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          pnpm prisma db push --skip-generate

      - name: Seed isolated browser preview
        env:
          COMMERCE_PREVIEW_FIXTURE: '1'
          COMMERCE_PREVIEW_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_commerce_preview_20260919
        run: pnpm exec vitest run --config vitest.preview.config.ts

      - name: Browser end-to-end on isolated preview
        env:
          COMMERCE_PREVIEW_DATABASE_URL: mysql://root:ci_root_password@127.0.0.1:33309/trbhh_commerce_preview_20260919
          PREVIEW_ARTIFACTS_DIR: artifacts/preproduction-e2e
          SUPPLIER_ALLOW_LIVE_ORDERS: 'false'
        run: node tests/preview/browser.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preproduction-browser-evidence
          path: artifacts/preproduction-e2e
          if-no-files-found: warn
