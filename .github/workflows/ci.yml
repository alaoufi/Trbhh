name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # لا تحدّد إصدار pnpm هنا — يُقرأ من حقل packageManager في package.json
      # (تحديده في الموضعين يسبّب ERR_PNPM_BAD_PM_VERSION ويُفشل الفحص).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # postinstall runs `prisma generate` — needs a placeholder URL only.
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
