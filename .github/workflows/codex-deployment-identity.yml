name: Reconcile verified superseded deployment marker
on:
  push:
    branches: [codex/deploy-diagnostics-20261012]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current identity and archive the superseded marker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set +x +v
          set -euo pipefail
          umask 077
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          port=${VPS_PORT:-22}
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( 10#$port > 0 && 10#$port <= 65535 ))
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/diag-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/diag-hosts"
          trap 'rm -f -- "$RUNNER_TEMP/diag-key" "$RUNNER_TEMP/diag-hosts"' EXIT
          ssh -i "$RUNNER_TEMP/diag-key" -p "$port" -o UserKnownHostsFile="$RUNNER_TEMP/diag-hosts" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set +x +v
          set -eu
          cd /root/trbhh
          printf 'CHECKOUT_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'WORKTREE_CHANGES=%s\n' "$(git status --porcelain --untracked-files=no | wc -l)"
          running=$(docker compose ps -q app)
          image=$(docker inspect -f '{{.Image}}' "$running")
          printf 'IMAGE_REVISION=%s\n' "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          marker=/root/trbhh-release-tools/ACTIVE_DEPLOYMENT
          if [[ -f "$marker" && ! -L "$marker" ]]; then
            stale=$(cat "$marker")
            if [[ "$stale" =~ ^[1-9][0-9]{0,19}$ ]]; then
              printf 'ACTIVE_RUN=%s\n' "$stale"
              backup="/root/trbhh-release-backups/finance-$stale"
              for name in VERIFIED commit.txt candidate.txt image-id.txt SHA256SUMS DEPLOYMENT_VERIFIED ROLLED_BACK; do
                if [[ -f "$backup/$name" && ! -L "$backup/$name" ]]; then printf 'MANIFEST_%s=present\n' "$name"; else printf 'MANIFEST_%s=absent\n' "$name"; fi
              done
              for name in commit.txt candidate.txt; do
                if [[ -f "$backup/$name" ]]; then value=$(cat "$backup/$name"); if [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then printf '%s=%s\n' "$name" "$value"; fi; fi
              done
              if [[ -f "$backup/SHA256SUMS" ]] && (cd "$backup" && sha256sum --check --status SHA256SUMS); then printf 'MANIFEST_INTEGRITY=valid\n'; else printf 'MANIFEST_INTEGRITY=invalid\n'; fi
              if [[ -f "$backup/image-id.txt" && "$(cat "$backup/image-id.txt")" == "$image" ]]; then printf 'BASELINE_IMAGE_MATCH=true\n'; else printf 'BASELINE_IMAGE_MATCH=false\n'; fi
              if systemctl is-active --quiet "trbhh-finance-rollback-$stale.timer"; then printf 'OLD_WATCHDOG=active\n'; else printf 'OLD_WATCHDOG=inactive\n'; fi
            else printf 'ACTIVE_MARKER=invalid\n'; fi
          elif [[ -e "$marker" || -L "$marker" ]]; then printf 'ACTIVE_MARKER=unsafe_type\n'
          else printf 'ACTIVE_MARKER=absent\n'; fi
          if [[ -e /root/trbhh-release-backups/finance-38277238094 ]]; then printf 'FAILED_ATTEMPT_BACKUP=present\n'; else printf 'FAILED_ATTEMPT_BACKUP=absent\n'; fi
          docker exec -i "$running" node - <<'NODE'
          (async()=>{try{const r=await fetch('http://127.0.0.1:3000/api/version',{signal:AbortSignal.timeout(5000)});const b=await r.json();console.log('APP_REVISION='+(/^[0-9a-f]{40}$/.test(b.commit)?b.commit:'invalid'));console.log('APP_HTTP='+r.status);}catch{console.log('APP_HTTP=unavailable');process.exitCode=1;}})();
          NODE

          # Reconcile only the exact superseded attempt observed by read-only diagnostics.
          exec 9>/run/lock/trbhh-finance-deploy.lock
          flock -w 5 9
          expected=c37790f2e08d0907cd5c2ff2d091e698a2e2c65e
          old=37944504207
          marker=/root/trbhh-release-tools/ACTIVE_DEPLOYMENT
          backup="/root/trbhh-release-backups/finance-$old"
          archived="/root/trbhh-release-tools/ACTIVE_DEPLOYMENT.superseded-$old-38277238094"
          [[ -f "$marker" && ! -L "$marker" && "$(cat "$marker")" == "$old" ]]
          [[ ! -e "$archived" && ! -L "$archived" ]]
          [[ "$(git rev-parse HEAD)" == "$expected" && -z "$(git status --porcelain --untracked-files=no)" ]]
          [[ "$(cat "$backup/commit.txt")" == "1eecf005519bd91ac3a5e3b77208820853b695f7" ]]
          [[ "$(cat "$backup/candidate.txt")" == "b7ccdc3a557e04bda61f8201159bb029277643e3" ]]
          (cd "$backup" && sha256sum --check --status SHA256SUMS)
          git merge-base --is-ancestor "$(cat "$backup/candidate.txt")" "$expected"
          git merge-base --is-ancestor "$(cat "$backup/commit.txt")" "$expected"
          ! systemctl is-active --quiet "trbhh-finance-rollback-$old.timer"
          ! systemctl is-active --quiet "trbhh-finance-rollback-$old.service"
          running=$(docker compose ps -q app)
          image=$(docker inspect -f '{{.Image}}' "$running")
          [[ "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" == "$expected" ]]
          docker exec -i "$running" node - "$expected" <<'NODE'
          const {PrismaClient}=require('@prisma/client');const db=new PrismaClient({log:[]});
          (async()=>{try{
            const r=await fetch('http://127.0.0.1:3000/api/version',{cache:'no-store',redirect:'error',signal:AbortSignal.timeout(5000)});
            if(r.status!==200||(await r.json()).commit!==process.argv[2])throw Error('identity');
            const home=await fetch('http://127.0.0.1:3000/',{redirect:'manual',signal:AbortSignal.timeout(10000)});
            if(home.status!==200)throw Error('home');
            const rows=await db.$queryRawUnsafe("SELECT v FROM site_settings WHERE k IN ('commerce_purchasing_enabled','commerce_payments_enabled','commerce_enabled')");
            if(rows.some(row=>!['0','false',null].includes(row.v))||process.env.SUPPLIER_ALLOW_LIVE_ORDERS!=='false')throw Error('gates');
            console.log('CURRENT_HEALTH_AND_PURCHASE_GATES=verified');
          }catch{console.log('CURRENT_HEALTH_AND_PURCHASE_GATES=failed');process.exitCode=1;}finally{await db.$disconnect();}})();
          NODE
          mv -- "$marker" "$archived"
          printf 'SUPERSEDED_MARKER_ARCHIVED=true\n'
          REMOTE
