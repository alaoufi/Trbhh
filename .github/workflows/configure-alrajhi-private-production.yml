name: Configure private Al Rajhi production checkout

on:
  workflow_dispatch:
    inputs:
      activate_payments:
        description: 'Enable the verified Al Rajhi production method for members'
        required: false
        default: false
        type: boolean

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      ALRAJHI_TERMINAL_ID: ${{ secrets.ALRAJHI_TERMINAL_ID }}
      ALRAJHI_TERMINAL_NAME: ${{ secrets.ALRAJHI_TERMINAL_NAME }}
      ALRAJHI_MERCHANT_ID: ${{ secrets.ALRAJHI_MERCHANT_ID }}
      ALRAJHI_TERMINAL_ALIAS_NAME: ${{ secrets.ALRAJHI_TERMINAL_ALIAS_NAME }}
      ALRAJHI_TRANPORTAL_ID: ${{ secrets.ALRAJHI_TRANPORTAL_ID }}
      ALRAJHI_TRANPORTAL_PASSWORD: ${{ secrets.ALRAJHI_TRANPORTAL_PASSWORD }}
      ALRAJHI_TERMINAL_RESOURCE_KEY: ${{ secrets.ALRAJHI_TERMINAL_RESOURCE_KEY }}
      ALRAJHI_PAYMENT_GATEWAY_URL: ${{ secrets.ALRAJHI_PAYMENT_GATEWAY_URL }}
      ALRAJHI_TRANPORTAL_GATEWAY_URL: ${{ secrets.ALRAJHI_TRANPORTAL_GATEWAY_URL }}
      DATABASE_PAYMENT_SECRET: ${{ secrets.DATABASE_PAYMENT_SECRET }}
      ACTIVATE_PAYMENTS: ${{ inputs.activate_payments }}
    steps:
      - name: Validate and apply private production settings only
        shell: bash
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_USER VPS_SSH_KEY ALRAJHI_TERMINAL_ID ALRAJHI_TERMINAL_NAME ALRAJHI_MERCHANT_ID ALRAJHI_TERMINAL_ALIAS_NAME ALRAJHI_TRANPORTAL_ID ALRAJHI_TRANPORTAL_PASSWORD ALRAJHI_TERMINAL_RESOURCE_KEY ALRAJHI_PAYMENT_GATEWAY_URL ALRAJHI_TRANPORTAL_GATEWAY_URL DATABASE_PAYMENT_SECRET; do
            if [ -z "${!key:-}" ]; then echo "Missing required secret: $key"; exit 1; fi
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          python3 - <<'PY' | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "python3 -c \"import base64,json,pathlib,sys; values=json.loads(base64.b64decode(sys.stdin.read()).decode()); path=pathlib.Path('/root/trbhh/.env'); lines=path.read_text().splitlines() if path.exists() else []; exec(\\\"for key, value in values.items():\\n    lines[:] = [line for line in lines if not line.startswith(key + '=')]\\n    lines.append(key + '=' + value)\\\"); path.write_text('\\n'.join(lines) + '\\n')\""
          import base64, json, os
          values = {
            'PAYMENT_PROVIDER': 'alrajhi_arb',
            'ALRAJHI_ENVIRONMENT': 'production',
            'ALRAJHI_TERMINAL_ID': os.environ['ALRAJHI_TERMINAL_ID'],
            'ALRAJHI_TERMINAL_NAME': os.environ['ALRAJHI_TERMINAL_NAME'],
            'ALRAJHI_MERCHANT_ID': os.environ['ALRAJHI_MERCHANT_ID'],
            'ALRAJHI_TERMINAL_ALIAS_NAME': os.environ['ALRAJHI_TERMINAL_ALIAS_NAME'],
            'ALRAJHI_TRANPORTAL_ID': os.environ['ALRAJHI_TRANPORTAL_ID'],
            'ALRAJHI_TRANPORTAL_PASSWORD': os.environ['ALRAJHI_TRANPORTAL_PASSWORD'],
            'ALRAJHI_TERMINAL_RESOURCE_KEY': os.environ['ALRAJHI_TERMINAL_RESOURCE_KEY'],
            'ALRAJHI_PAYMENT_GATEWAY_URL': os.environ['ALRAJHI_PAYMENT_GATEWAY_URL'],
            'ALRAJHI_TRANPORTAL_GATEWAY_URL': os.environ['ALRAJHI_TRANPORTAL_GATEWAY_URL'],
            'DATABASE_PAYMENT_SECRET': os.environ['DATABASE_PAYMENT_SECRET'],
          }
          # Docker Compose interpolates a single "$" in .env. Escape it here
          # so credentials such as a Tranportal password arrive unchanged inside
          # the app container (Compose converts "$$" back to a literal "$" ).
          compose_values = {key: value.replace('$', '$$') for key, value in values.items()}
          print(base64.b64encode(json.dumps(compose_values).encode()).decode())
          PY
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'cd /root/trbhh && docker compose up -d --force-recreate app && docker compose ps app'
          if [ "${ACTIVATE_PAYMENTS:-false}" = "true" ]; then
            cat > /tmp/activate-alrajhi.js <<'NODE'
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            const values = {
              pay_online_on: '1',
              payment_electronic_enabled: '1',
              pay_provider: 'alrajhi_arb',
              pay_mode: 'live',
            };
            (async () => {
              for (const [k, v] of Object.entries(values)) {
                await prisma.site_settings.upsert({ where: { k }, create: { k, v }, update: { v } });
              }
              const saved = await prisma.site_settings.findMany({
                where: { k: { in: Object.keys(values) } },
                select: { k: true, v: true },
                orderBy: { k: 'asc' },
              });
              if (saved.length !== Object.keys(values).length || saved.some((row) => values[row.k] !== row.v)) {
                throw new Error('Payment activation settings verification failed');
              }
              console.log(JSON.stringify({ activated: true, settings: saved.map(({ k, v }) => ({ k, v })) }));
            })().finally(async () => { await prisma.$disconnect(); });
          NODE
            PORT="${VPS_PORT:-22}"
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -P "$PORT" /tmp/activate-alrajhi.js "$VPS_USER@$VPS_HOST:/tmp/activate-alrajhi.js"
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
              'docker cp /tmp/activate-alrajhi.js trbhh-app:/tmp/activate-alrajhi.js && docker exec trbhh-app node /tmp/activate-alrajhi.js && rm -f /tmp/activate-alrajhi.js'
          fi
