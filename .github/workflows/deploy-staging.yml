name: نشر بيئة التجريب (Staging)

on:
  push:
    branches: [staging]
    paths-ignore: ['ops/**']
  workflow_dispatch:
    inputs:
      live_read_only:
        description: ربط المعاينة ببيانات الإنتاج عبر مستخدم MySQL للقراءة فقط
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vps-deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/codex/trbhh-platform-enhancement-20260929')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: نشر commit الفرع المطلوب على Hostinger
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
          LIVE_READ_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.live_read_only }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          if [[ "$LIVE_READ_ONLY" == 'true' ]]; then
            test "$DEPLOY_REF" = 'codex/trbhh-platform-enhancement-20260929'
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          dir="${STAGING_DIR:-/root/trbhh-staging}"
          test "$dir" = '/root/trbhh-staging'
          target="$VPS_USER@$VPS_HOST"
          ssh_args=(-i ~/.ssh/deploy_key -p "$port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          remote_script="/tmp/trbhh-preview-readonly-$GITHUB_RUN_ID.cjs"
          if [[ "$LIVE_READ_ONLY" == 'true' ]]; then
            scp -i ~/.ssh/deploy_key -P "$port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              scripts/release/configure-live-readonly-preview.cjs "$target:$remote_script"
          fi

          remote_log=$(mktemp)
          ssh "${ssh_args[@]}" "$target" bash -s -- "$dir" "$DEPLOY_REF" "$DEPLOY_SHA" "$LIVE_READ_ONLY" "$remote_script" "$VPS_HOST" <<'REMOTE' | tee "$remote_log"
          set -euo pipefail
          umask 077
          dir=$1
          ref=$2
          sha=$3
          live_read_only=$4
          readonly_script=$5
          public_host=$6
          test "$dir" = /root/trbhh-staging
          test ! -L "$dir"
          test "$(realpath "$dir")" = "$dir"
          cd "$dir"
          git fetch --no-tags origin "$ref"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          git reset --hard "$sha"

          set_env() {
            key=$1
            value=$2
            file=$3
            [[ "$key" =~ ^[A-Z0-9_]+$ ]]
            test -f "$file"
            test ! -L "$file"
            tmp=$(mktemp "$dir/.env.XXXXXX")
            grep -v "^${key}=" "$file" > "$tmp" || true
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            chmod 600 "$tmp"
            mv "$tmp" "$file"
          }

          read_env_value() {
            key=$1
            file=$2
            [[ "$key" =~ ^[A-Z0-9_]+$ ]]
            test -f "$file"
            grep -m1 "^${key}=" "$file" | cut -d= -f2- | tr -d '\r'
          }

          urlencode_env_value() {
            local LC_ALL=C input=$1 encoded='' char hex index
            for ((index = 0; index < ${#input}; index++)); do
              char=${input:index:1}
              case "$char" in
                [a-zA-Z0-9.~_-]) encoded+="$char" ;;
                *) printf -v hex '%%%02X' "'$char"; encoded+="$hex" ;;
              esac
            done
            printf '%s' "$encoded"
          }

          staging_auth_secret=$(grep -m1 '^AUTH_SECRET=' .env | cut -d= -f2- || true)
          if (( ${#staging_auth_secret} < 32 )); then
            staging_auth_secret=$(openssl rand -hex 32)
          fi
          set_env AUTH_SECRET "$staging_auth_secret" .env
          unset staging_auth_secret

          if [[ "$live_read_only" == true ]]; then
            test -f "$readonly_script"
            prod=/root/trbhh
            test ! -L "$prod"
            test "$(realpath "$prod")" = "$prod"
            prod_container=$(cd "$prod" && docker compose ps -q app)
            test -n "$prod_container"
            test "$(docker inspect -f '{{.State.Running}}' "$prod_container")" = true

            readonly_user=trbhh_preview_ro
            readonly_password=$(openssl rand -hex 24)
            container_script=/tmp/trbhh-configure-live-readonly-preview.cjs
            docker cp "$readonly_script" "$prod_container:$container_script"
            docker exec -u 0 "$prod_container" chmod 644 "$container_script"

            live_database=$(docker exec "$prod_container" node -e '
              const url = new URL(process.env.DATABASE_URL);
              const database = decodeURIComponent(url.pathname.slice(1));
              if (!/^[A-Za-z0-9_]{1,64}$/.test(database)) process.exit(1);
              process.stdout.write(database);
            ')
            test -n "$live_database"

            master_credentials=$(clpctl db:show:master-credentials)
            read_master_value() {
              local label=$1
              printf '%s\n' "$master_credentials" | tr -d '\r' | awk -F'|' -v label="$label" '
                { key=$2; gsub(/^[ \t]+|[ \t]+$/, "", key) }
                key == label { value=$3; gsub(/^[ \t]+|[ \t]+$/, "", value); print value; exit }
              '
            }
            master_host=$(read_master_value Host)
            master_user=$(read_master_value 'User Name')
            master_password=$(read_master_value Password)
            master_port=$(read_master_value Port)
            unset master_credentials
            test -n "$master_host"
            test -n "$master_user"
            test -n "$master_password"
            [[ "$master_port" =~ ^[0-9]+$ ]]

            readonly_sql=$(docker exec \
              -e PREVIEW_DATABASE="$live_database" \
              -e PREVIEW_READONLY_USER="$readonly_user" \
              -e PREVIEW_READONLY_PASSWORD="$readonly_password" \
              "$prod_container" node "$container_script" --emit-sql)
            grant_report=$(
              {
                printf '%s\n' "$readonly_sql"
                printf "SHOW GRANTS FOR '%s'@'%%';\n" "$readonly_user"
              } | MYSQL_PWD="$master_password" mysql \
                --host="$master_host" --port="$master_port" --user="$master_user" \
                --batch --skip-column-names
            )
            unset readonly_sql master_password master_host master_user master_port
            grant_upper=$(printf '%s' "$grant_report" | tr '[:lower:]' '[:upper:]')
            [[ "$grant_upper" == *SELECT* ]]
            [[ "$grant_upper" == *'SHOW VIEW'* ]]
            if printf '%s' "$grant_upper" | grep -Eq '\b(INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|TRIGGER|EXECUTE|FILE|PROCESS|SUPER|RELOAD|SHUTDOWN|GRANT OPTION)\b'; then
              echo preview_readonly_grants_rejected >&2
              exit 1
            fi
            unset grant_report grant_upper live_database
            docker exec -u 0 "$prod_container" rm -f "$container_script"

            readonly_url=$(docker exec \
              -e PREVIEW_READONLY_USER="$readonly_user" \
              -e PREVIEW_READONLY_PASSWORD="$readonly_password" \
              "$prod_container" node -e '
                const url = new URL(process.env.DATABASE_URL);
                url.username = process.env.PREVIEW_READONLY_USER;
                url.password = process.env.PREVIEW_READONLY_PASSWORD;
                url.searchParams.delete("connection_limit");
                url.searchParams.delete("pool_timeout");
                process.stdout.write(url.toString());
              ')
            test -n "$readonly_url"

            set_env DATABASE_URL "$readonly_url" .env
            set_env TRBHH_READ_ONLY_PREVIEW 1 .env
            set_env SUPPLIER_ALLOW_LIVE_ORDERS false .env
            set_env CATEGORIES_DEFAULT_ENABLED 0 .env
            set_env COOKIE_SECURE false .env
            set_env APP_PORT 3081 .env
            set_env LEGACY_MEDIA_BASE https://trbhh.sa/media .env
            set_env NEXT_PUBLIC_MEDIA_BASE https://trbhh.sa .env
          else
            staging_db_user=$(read_env_value DB_USER .env)
            staging_db_password=$(read_env_value DB_PASSWORD .env)
            staging_db_name=$(read_env_value DB_NAME .env)
            test -n "$staging_db_user"
            test -n "$staging_db_password"
            [[ "$staging_db_name" =~ ^[A-Za-z0-9_]{1,64}$ ]]
            encoded_staging_db_user=$(urlencode_env_value "$staging_db_user")
            encoded_staging_db_password=$(urlencode_env_value "$staging_db_password")
            staging_database_url="mysql://${encoded_staging_db_user}:${encoded_staging_db_password}@db:3306/${staging_db_name}"
            set_env DATABASE_URL "$staging_database_url" .env
            unset staging_db_user staging_db_password staging_db_name encoded_staging_db_user encoded_staging_db_password staging_database_url
            set_env TRBHH_READ_ONLY_PREVIEW 0 .env
            set_env SUPPLIER_ALLOW_LIVE_ORDERS false .env
            set_env CATEGORIES_DEFAULT_ENABLED 0 .env
            set_env COOKIE_SECURE false .env
            set_env APP_PORT 3081 .env
            set_env LEGACY_MEDIA_BASE "" .env
            set_env NEXT_PUBLIC_MEDIA_BASE "" .env
          fi

          docker compose -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build app redis
          if [[ "$live_read_only" != true ]]; then
            timeout 180s docker compose -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml \
              exec -T -e STAGING_CATEGORY_SEED=1 -e STAGING_DATABASE_NAME=trbhhdb app \
              node scripts/release/seed-staging-categories.cjs
          fi

          printf 'previewSeed=complete\n'
          find_preview_container() {
            container=''
            for attempt in $(seq 1 30); do
              container=$(docker ps -aq \
                --filter label=com.docker.compose.project=trbhh-staging \
                --filter label=com.docker.compose.service=app | sed -n '1p')
              if [[ -n "$container" ]] && docker inspect "$container" >/dev/null 2>&1; then
                printf 'previewContainerDiscovered=%s attempt=%s\n' "$container" "$attempt"
                return 0
              fi
              sleep 2
            done
            docker ps -a --no-trunc >&2 || true
            printf 'previewContainerDiscovered=missing failed\n' >&2
            return 1
          }
          find_preview_container
          wait_for_preview_container() {
            state=false
            for attempt in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)
              if [[ "$state" == true ]]; then
                printf 'previewContainerReady=running attempt=%s\n' "$attempt"
                return 0
              fi
              sleep 2
            done
            docker logs --tail 100 "$container" >&2 || true
            printf 'previewContainerReady=%s failed\n' "$state" >&2
            return 1
          }
          wait_for_preview_container
          published_ports=$(docker port "$container" 3000)
          printf 'previewDockerPorts=%s\n' "$(printf '%s' "$published_ports" | tr '\n' ' ')"
          printf '%s\n' "$published_ports" | grep -Fx '0.0.0.0:3081'
          ss -lntp | grep -E '(^|:)3081\b'
          wait_for_preview_200() {
            label=$1
            url=$2
            status=000
            for attempt in $(seq 1 30); do
              status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url" || true)
              if [[ "$status" == 200 ]]; then
                printf 'previewHttpReady=%s status=%s attempt=%s\n' "$label" "$status" "$attempt"
                return 0
              fi
              sleep 2
            done
            printf 'previewHttpReady=%s status=%s failed\n' "$label" "$status" >&2
            return 1
          }
          wait_for_preview_200 loopback http://127.0.0.1:3081/
          wait_for_preview_200 public-port "http://$public_host:3081/"

          echo 'previewFirewallAudit=ufw'
          if command -v ufw >/dev/null 2>&1; then ufw status verbose || true; else echo 'ufw unavailable'; fi
          echo 'previewFirewallAudit=iptables'
          if command -v iptables >/dev/null 2>&1; then iptables -S || true; else echo 'iptables unavailable'; fi
          echo 'previewFirewallAudit=nftables'
          if command -v nft >/dev/null 2>&1; then nft list ruleset || true; else echo 'nft unavailable'; fi
          echo 'previewReverseProxyAudit'
          for service in nginx caddy traefik; do
            if systemctl is-active --quiet "$service" 2>/dev/null; then echo "$service=active"; else echo "$service=inactive-or-unavailable"; fi
          done
          preview_domain='preview.88-223-92-124.sslip.io'
          preview_url="https://$preview_domain"
          test "$(getent ahostsv4 "$preview_domain" | awk 'NR==1{print $1}')" = "$public_host"
          if ! nginx -T 2>&1 | grep -Eq "server_name[[:space:]]+$preview_domain([[:space:];]|$)"; then
            preview_site_password=$(openssl rand -hex 24)
            clpctl site:add:reverse-proxy \
              --domainName="$preview_domain" \
              --reverseProxyUrl='http://127.0.0.1:3081' \
              --siteUser=trbhhpreview \
              --siteUserPassword="$preview_site_password"
            unset preview_site_password
          fi
          if ! curl -fsSI --max-time 25 "$preview_url/" -o /dev/null; then
            clpctl lets-encrypt:install:certificate --domainName="$preview_domain"
          fi
          nginx -t
          systemctl reload nginx
          preview_https_status=000
          for attempt in $(seq 1 12); do
            preview_https_status=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$preview_url/" || true)
            if [[ "$preview_https_status" == 200 ]]; then break; fi
            sleep 2
          done
          test "$preview_https_status" = 200
          docker exec "$container" node -e "if((process.env.AUTH_SECRET||'').length<32)process.exit(1)"
          if [[ "$live_read_only" == true ]]; then
            docker exec -i "$container" node - <<'VERIFY'
          const {PrismaClient}=require('@prisma/client');
          const db=new PrismaClient();
          (async()=>{
            const grants=await db.$queryRawUnsafe('SHOW GRANTS FOR CURRENT_USER()');
            const text=grants.flatMap((row)=>Object.values(row).map(String)).join(' ').toUpperCase();
            if(!text.includes('SELECT')||!text.includes('SHOW VIEW')||/\b(INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|TRIGGER|EXECUTE|GRANT OPTION)\b/.test(text))throw Error('preview_grants_not_readonly');
            const [ads,categories,products,suppliers,categoryUsage]=await Promise.all([
              db.$queryRawUnsafe('SELECT COUNT(*) AS count FROM ads'),
              db.$queryRawUnsafe('SELECT COUNT(*) AS count FROM categories'),
              db.$queryRawUnsafe('SELECT COUNT(*) AS count FROM commerce_products'),
              db.$queryRawUnsafe('SELECT COUNT(*) AS count FROM commerce_suppliers'),
              db.$queryRawUnsafe('SELECT c.id,c.name,c.is_active,COUNT(a.id) AS ad_count FROM categories c LEFT JOIN ads a ON a.category_id=c.id GROUP BY c.id,c.name,c.is_active ORDER BY c.ordered,c.id'),
            ]);
            const count=(rows)=>String(rows[0]?.count??0);
            console.log(JSON.stringify({readOnly:true,ads:count(ads),categories:count(categories),products:count(products),suppliers:count(suppliers)}));
            console.log(JSON.stringify({categoryUsage:categoryUsage.map((row)=>({id:String(row.id),name:row.name,active:row.is_active,ads:String(row.ad_count)}))}));
          })().finally(()=>db.$disconnect());
          VERIFY
            quality_summary=$(docker exec "$container" node -e '
              const {execFileSync}=require("node:child_process");
              const report=JSON.parse(execFileSync(process.execPath,["scripts/release/audit-live-ad-quality.cjs"],{encoding:"utf8",maxBuffer:64*1024*1024}));
              process.stdout.write(JSON.stringify({
                summary:report.summary,
                publicSummary:report.publicSummary,
                taxonomy:report.taxonomy,
                schema:report.schema,
                countAlignment:report.countAlignment,
                taxonomyResolution:report.taxonomyResolution,
                businessDecisions:report.businessDecisions,
                autoFixPlan:report.autoFixPlan,
                confirmedCases:report.records.filter((row)=>["3412","3420"].includes(String(row.id))),
              }));
            ')
            test -n "$quality_summary"
            printf 'AD_QUALITY_SUMMARY=%s\n' "$quality_summary"
          fi
          preview_logs=$(docker compose -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml logs --since 10m --no-color app 2>&1)
          if printf '%s\n' "$preview_logs" | grep -Eiq 'uncaught exception|unhandled rejection|fatal error|PrismaClientInitializationError'; then
            printf '%s\n' "$preview_logs" >&2
            echo 'previewRecentLogs=runtime-errors-found' >&2
            exit 1
          fi
          unset preview_logs
          echo 'previewRecentLogs=clean'
          rm -f "$readonly_script"
          docker rm -f trbhh-staging-tunnel >/dev/null 2>&1 || true
          docker compose -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml ps
          printf 'PREVIEW_URL=%s\n' "$preview_url"
          REMOTE

          status=000
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /tmp/trbhh-preview-home.html -w '%{http_code}' "http://$VPS_HOST:3081/" || true)
            if [[ "$status" == 200 ]]; then break; fi
            sleep 3
          done
          test "$status" = 200
          preview_url=$(sed -n 's/^PREVIEW_URL=//p' "$remote_log" | tail -1)
          test "$preview_url" = 'https://preview.88-223-92-124.sslip.io'
          anonymous_headers=$(mktemp)
          anonymous_status=$(curl -sS --max-time 30 \
            -D "$anonymous_headers" \
            -o /tmp/trbhh-external-preview.html \
            -w '%{http_code}' \
            -H 'Cookie:' \
            -H 'Authorization:' \
            -A 'GPTBot/1.0' \
            "$preview_url/")
          test "$anonymous_status" = 200
          ! grep -qi '^www-authenticate:' "$anonymous_headers"
          robots_header=$(tr -d '\r' < "$anonymous_headers" | awk -F': ' 'tolower($1)=="x-robots-tag"{print tolower($2)}' | tail -1)
          if [[ "$LIVE_READ_ONLY" == 'true' ]]; then
            test "$robots_header" = 'noindex, nofollow, noarchive'
            curl -fsS --max-time 25 "$preview_url/robots.txt" | grep -F 'Disallow: /'
          fi
          rm -f "$anonymous_headers"
          for public_route in '/search' '/deals' '/nearby' '/companies' '/shop' '/guide' '/site-map'; do
            test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H 'Cookie:' -H 'Authorization:' "$preview_url$public_route")" = 200
          done
          crawl_report=$(node scripts/release/crawl-public-preview.cjs "$preview_url")
          test -n "$crawl_report"
          printf 'PUBLIC_CRAWL=%s\n' "$crawl_report"
          if [[ "$LIVE_READ_ONLY" == 'true' ]]; then
            external_preview_mode=$(curl -sSI --max-time 25 "$preview_url/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-trbhh-preview-mode"{print tolower($2)}' | tail -1)
            test "$external_preview_mode" = read-only
            test "$(curl -sSI "http://$VPS_HOST:3081/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-trbhh-preview-mode"{print tolower($2)}' | tail -1)" = read-only
            test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://$VPS_HOST:3081/api/integrations/salla/webhooks")" = 405
          fi
          quality_summary=$(sed -n 's/^AD_QUALITY_SUMMARY=//p' "$remote_log" | tail -1)
          rm -f "$remote_log"
          printf '### معاينة Hostinger\n\n- HTTPS URL: %s\n- Direct URL: http://%s:3081/\n- Commit: `%s`\n- Live read-only: `%s`\n- External verification: `anonymous GPTBot GET = HTTP 200, no Authorization/Cookie`\n- Public routes: `search, deals, nearby, companies, shop, guide, site-map = HTTP 200`\n- Public crawl: `%s`\n- SEO isolation: `X-Robots-Tag + robots.txt verified`\n- Read-only ad audit: `%s`\n' "$preview_url" "$VPS_HOST" "$DEPLOY_SHA" "$LIVE_READ_ONLY" "${crawl_report:-not-run}" "${quality_summary:-not-run}" >> "$GITHUB_STEP_SUMMARY"
