name: نشر بيئة التجريب (Staging)

# نشر تلقائي ذاتي‑التجهيز لبيئة التجريب المعزولة: عند كل دفع لفرع staging يتّصل GitHub
# بالخادم عبر SSH. في أول مرّة (لا يوجد دليل تجريب) يجهّزه آلياً: استنساخ المستودع في
# /root/trbhh-staging، توليد .env خاص (منفذ 3081 + قاعدة تجريب MySQL مستقلّة + سرّ جديد)،
# ثم تشغيل الحاويات. في المرّات التالية يسحب أحدث كود الفرع ويعيد البناء. بمشروع Docker
# منفصل وقاعدة مستقلّة — لا يمسّ الإنتاج ولا قاعدته إطلاقاً. يدوياً أيضاً عبر Run workflow.
on:
  push:
    branches:
      - staging
    paths-ignore:
      - 'ops/**'
  workflow_dispatch:

concurrency:
  group: vps-deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: النشر/التجهيز عبر SSH (بيئة التجريب)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
          PROD_DIR: ${{ secrets.PROD_DIR }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "❌ أسرار الخادم (VPS_HOST/VPS_USER/VPS_SSH_KEY) غير مكتملة."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q "PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "❌ المفتاح غير صالح — تأكد أن VPS_SSH_KEY لصق كاملاً بأسطره."
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          DIR="${STAGING_DIR:-/root/trbhh-staging}"
          PROD="${PROD_DIR:-/root/trbhh}"
          echo "🔗 التجريب على $VPS_USER@$VPS_HOST:$PORT ($DIR) ..."
          REMOTE_CMD=$(cat <<REMOTE
          set -e
          COMPOSE="docker compose --profile localdb -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml"
          if [ ! -d "$DIR/.git" ]; then
            echo "== أول تجهيز: استنساخ المستودع =="
            ORIGIN=\$(cd "$PROD" && git remote get-url origin)
            git clone "\$ORIGIN" "$DIR"
          fi
          cd "$DIR"
          git fetch origin staging
          git checkout -B staging origin/staging
          git reset --hard origin/staging
          if [ ! -f .env ]; then
            echo "== توليد .env للتجريب (قاعدة مستقلّة + سرّ جديد) =="
            SECRET=\$(openssl rand -hex 32)
            DBPASS=\$(openssl rand -hex 16)
            DBROOT=\$(openssl rand -hex 16)
            {
              echo "APP_PORT=3081"
              echo "DB_NAME=trbhhdb"
              echo "DB_USER=trbhh"
              echo "DB_PASSWORD=\$DBPASS"
              echo "DB_ROOT_PASSWORD=\$DBROOT"
              echo "AUTH_SECRET=\$SECRET"
              echo "COOKIE_SECURE=true"
              echo "LEGACY_MEDIA_BASE=https://trbhh.com"
              echo "LEGACY_LOCAL_DIR="
              echo "NEXT_PUBLIC_MEDIA_BASE="
              echo "REALESTATE_ONLY=1"
            } > .env
            chmod 600 .env
          fi
          # بيئة عقارية فقط (beta): نضمن وجود REALESTATE_ONLY=1 حتى في .env المولّد سابقاً
          if grep -q '^REALESTATE_ONLY=' .env; then
            sed -i 's|^REALESTATE_ONLY=.*|REALESTATE_ONLY=1|' .env
          else
            echo 'REALESTATE_ONLY=1' >> .env
          fi
          # صور الإعلانات القديمة تُجلب من الموقع الحيّ (قراءة فقط) — ملفاتها ليست في التجريب
          if grep -q '^LEGACY_MEDIA_BASE=' .env; then
            sed -i 's|^LEGACY_MEDIA_BASE=.*|LEGACY_MEDIA_BASE=https://trbhh.com|' .env
          else
            echo 'LEGACY_MEDIA_BASE=https://trbhh.com' >> .env
          fi
          echo "== بناء وتشغيل الحاويات (قد يستغرق دقائق أول مرّة) =="
          \$COMPOSE up -d --build
          echo "== الحالة =="
          \$COMPOSE ps
          echo "== إلغاء موقع beta.trbhh.com نهائياً (استُبدل بـ agar) =="
          if [ ! -f /root/.trbhh-beta-removed ] && command -v clpctl >/dev/null 2>&1; then
            # حذف أفضل‑جهد لموقع beta من CloudPanel (سجل DNS مُزال أصلاً فالموقع غير قابل للوصول)
            clpctl site:delete --domainName='beta.trbhh.com' --force >/dev/null 2>&1 || true
            touch /root/.trbhh-beta-removed
            echo '✅ أُلغي موقع beta (agar هو النطاق الرسمي الآن).'
          else
            echo 'beta مُلغى مسبقاً (أو لا توجد clpctl).'
          fi
          echo "== إعداد موقع agar.trbhh.com (تربح للعقار) في CloudPanel =="
          if command -v clpctl >/dev/null 2>&1; then
            # إنشاء موقع الوكيل العكسي مرّة واحدة
            if [ ! -f /root/.trbhh-agar-site-done ]; then
              SITEPASS2=\$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)
              echo "-- إنشاء موقع Reverse Proxy → 127.0.0.1:3081 --"
              clpctl site:add:reverse-proxy --domainName='agar.trbhh.com' --reverseProxyUrl='http://127.0.0.1:3081' --siteUser='trbhhagar' --siteUserPassword="\$SITEPASS2" 2>&1 | grep -iv 'password' || true
              touch /root/.trbhh-agar-site-done
            fi
            # SSL: يُحاول في كل نشر حتى ينجح بعد جهوز سجل DNS (لا يضر تكراره)
            if [ ! -f /root/.trbhh-agar-ssl-done ]; then
              if clpctl lets-encrypt:install:certificate --domainName='agar.trbhh.com' >/tmp/agar-ssl.log 2>&1; then
                touch /root/.trbhh-agar-ssl-done; echo '✅ شهادة SSL لـ agar رُكّبت.'
              else
                echo '(SSL agar لم تُركّب بعد — أضِف سجل DNS A لـ agar، وسيُركّب تلقائياً في النشر التالي)'; tail -4 /tmp/agar-ssl.log || true
              fi
            else
              echo 'شهادة agar مُركّبة مسبقاً.'
            fi
          fi
          echo "== إعداد نطاق trbhh.sa (السعودي) → الموقع الرئيسي تربح (127.0.0.1:3080) =="
          if command -v clpctl >/dev/null 2>&1; then
            # trbhh.sa (النطاق الجذر) → الموقع الرئيسي على 3080
            if [ ! -f /root/.trbhh-sa-site-done ]; then
              SP=\$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)
              clpctl site:add:reverse-proxy --domainName='trbhh.sa' --reverseProxyUrl='http://127.0.0.1:3080' --siteUser='trbhhsa' --siteUserPassword="\$SP" 2>&1 | grep -iv 'password' || true
              touch /root/.trbhh-sa-site-done
            fi
            if [ ! -f /root/.trbhh-sa-ssl-done ]; then
              if clpctl lets-encrypt:install:certificate --domainName='trbhh.sa' >/tmp/sa-ssl.log 2>&1; then
                touch /root/.trbhh-sa-ssl-done; echo '✅ شهادة SSL لـ trbhh.sa رُكّبت.'
              else
                echo '(SSL trbhh.sa بانتظار سجل DNS — يُركّب تلقائياً في النشر التالي)'; tail -3 /tmp/sa-ssl.log || true
              fi
            fi
            # www.trbhh.sa → الموقع الرئيسي على 3080
            if [ ! -f /root/.trbhh-sa-www-site-done ]; then
              SPW=\$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)
              clpctl site:add:reverse-proxy --domainName='www.trbhh.sa' --reverseProxyUrl='http://127.0.0.1:3080' --siteUser='trbhhsawww' --siteUserPassword="\$SPW" 2>&1 | grep -iv 'password' || true
              touch /root/.trbhh-sa-www-site-done
            fi
            if [ ! -f /root/.trbhh-sa-www-ssl-done ]; then
              if clpctl lets-encrypt:install:certificate --domainName='www.trbhh.sa' >/tmp/sawww-ssl.log 2>&1; then
                touch /root/.trbhh-sa-www-ssl-done; echo '✅ شهادة SSL لـ www.trbhh.sa رُكّبت.'
              else
                echo '(SSL www.trbhh.sa بانتظار سجل DNS)'; tail -3 /tmp/sawww-ssl.log || true
              fi
            fi
          fi
          echo "== كشف لوحة تحكّم الخادم (للخطوة اليدوية الأخيرة) =="
          if command -v clpctl >/dev/null 2>&1; then echo "PANEL_DETECTED=CloudPanel"; fi
          if [ -d /www/server/panel ]; then echo "PANEL_DETECTED=aaPanel/BT"; fi
          if command -v caddy >/dev/null 2>&1; then echo "PANEL_DETECTED=Caddy"; fi
          if [ -d /etc/nginx ]; then echo "NGINX_PRESENT=/etc/nginx"; fi
          echo "== المنافذ المستمعة =="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ":(80|443|3080|3081)\b" || true
          echo "✅ تطبيق تربح للعقار يعمل داخلياً على 127.0.0.1:3081"
          echo "النطاق الرسمي: agar.trbhh.com ← Reverse Proxy إلى http://127.0.0.1:3081 + SSL"
          REMOTE
          )
          n=0
          until [ "$n" -ge 4 ]; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                 -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_CMD"; then
              echo "✅ اكتمل نشر/تجهيز بيئة التجريب."
              exit 0
            fi
            n=$((n + 1))
            [ "$n" -lt 4 ] && { echo "⚠️ إعادة المحاولة $n/4 بعد $((n*20))s ..."; sleep $((n * 20)); }
          done
          echo "❌ فشل الاتصال/التجهيز عبر SSH."
          exit 1
