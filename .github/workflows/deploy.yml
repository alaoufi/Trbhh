name: نشر تربح على Hostinger VPS

# نشر تلقائي: عند كل دفع للفرع، يتّصل GitHub بالخادم عبر SSH ويسحب أحدث الكود
# ويعيد بناء خدمة app في docker compose. يدوياً أيضاً عبر Run workflow.
on:
  push:
    branches:
      - claude/hostinger-vps-project-amw8vb
  workflow_dispatch:

# لا تشغّل نشرين متوازيين على نفس الخادم
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: النشر عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          # المفتاح الخاص مُرمّز base64 (سطر واحد) لتفادي تشوّه الأسطر عند اللصق
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY_B64" ]; then
            echo "❌ السرّ VPS_SSH_KEY_B64 غير موجود — أضِفه في إعدادات الأسرار."
            exit 1
          fi
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "❌ VPS_HOST أو VPS_USER غير مضبوط."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          echo "🔗 الاتصال بـ $VPS_USER@$VPS_HOST:$PORT ..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "set -e; cd /root/trbhh && git fetch origin claude/hostinger-vps-project-amw8vb && git reset --hard origin/claude/hostinger-vps-project-amw8vb && docker compose up -d --build app && docker compose ps"
