name: نشر تربح على Hostinger VPS

# نشر تلقائي: عند كل دفع للفرع، يتّصل GitHub بالخادم عبر SSH ويسحب أحدث الكود
# ويعيد بناء خدمة app في docker compose. يدوياً أيضاً عبر Run workflow.
on:
  push:
    branches:
      - claude/hostinger-vps-project-amw8vb
    # سجلّ مراقب الأخطاء (ops/) دفتر متابعة فقط — تحديثه لا يستدعي إعادة نشر
    paths-ignore:
      - 'ops/**'
  workflow_dispatch:

# لا تشغّل نشرين متوازيين على نفس الخادم
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: النشر عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          # المفتاح الخاص كنص خام متعدد الأسطر (يُلصق كما هو — بلا أي ترميز يعرّضه للتلف)
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ السرّ VPS_SSH_KEY غير موجود — أضِفه في إعدادات الأسرار."
            exit 1
          fi
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "❌ VPS_HOST أو VPS_USER غير مضبوط."
            exit 1
          fi
          mkdir -p ~/.ssh
          # نزيل أحرف \r فقط (قد تتسرّب من لوحات مفاتيح الجوال) مع إبقاء الأسطر كما هي
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q "PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "❌ المفتاح غير صالح — تأكد أن قيمة VPS_SSH_KEY لصقت كاملة بأسطرها (تبدأ بـ BEGIN OPENSSH PRIVATE KEY وتنتهي بـ END OPENSSH PRIVATE KEY)."
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          echo "🔗 الاتصال بـ $VPS_USER@$VPS_HOST:$PORT ..."
          REMOTE_CMD="set -e; cd /root/trbhh && git fetch origin claude/hostinger-vps-project-amw8vb && git reset --hard origin/claude/hostinger-vps-project-amw8vb && docker compose up -d --build app && docker compose ps"
          # اتصال SSH بالخادم متقطّع أحياناً (Connection timed out) — نعيد المحاولة تلقائياً
          # حتى ٥ مرات بتراجع تصاعدي بدل فشل النشر على أول انقطاع عابر.
          n=0
          until [ "$n" -ge 5 ]; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                 -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_CMD"; then
              echo "✅ تم النشر."
              exit 0
            fi
            n=$((n + 1))
            if [ "$n" -lt 5 ]; then
              wait=$((n * 20))
              echo "⚠️ تعذّر الاتصال (محاولة $n/5) — إعادة بعد ${wait}s ..."
              sleep "$wait"
            fi
          done
          echo "❌ فشل الاتصال بالخادم بعد ٥ محاولات — الخادم لا يستجيب لـ SSH حالياً."
          exit 1
