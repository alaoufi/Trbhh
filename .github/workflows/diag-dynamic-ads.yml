name: Verify Salla Demo Catalog Quarantine (read-only)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the quarantined association without modifying data
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${VPS_PORT:-22}"
          target="$VPS_USER@$VPS_HOST"
          remote_tools="/root/trbhh-release-tools/catalog-cleanup-$GITHUB_RUN_ID"
          ssh_args=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port")
          ssh "${ssh_args[@]}" "$target" "set -eu; test ! -L /root/trbhh-release-tools; mkdir -m 700 -p '$remote_tools'; test ! -L '$remote_tools'"
          scp -i ~/.ssh/deploy_key -P "$port" -o StrictHostKeyChecking=yes \
            scripts/release/salla-catalog-quarantine{,-plan}.cjs "$target:$remote_tools/"
          ssh "${ssh_args[@]}" "$target" "set -eu; cd /root/trbhh; container=\$(docker compose ps -q app); test -n \"\$container\"; docker cp '$remote_tools/salla-catalog-quarantine.cjs' \"\$container:/tmp/salla-catalog-quarantine.cjs\"; docker cp '$remote_tools/salla-catalog-quarantine-plan.cjs' \"\$container:/tmp/salla-catalog-quarantine-plan.cjs\"; docker compose exec -T -e NODE_PATH=/app/node_modules app node /tmp/salla-catalog-quarantine.cjs verify"
