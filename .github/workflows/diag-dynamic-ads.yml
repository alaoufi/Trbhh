name: Quarantine Proven Salla Demo Catalog

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quarantine the fingerprinted demo catalog in one transaction
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${VPS_PORT:-22}"
          target="$VPS_USER@$VPS_HOST"
          remote_tools="/root/trbhh-release-tools/catalog-cleanup-$GITHUB_RUN_ID"
          ssh_args=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port")
          ssh "${ssh_args[@]}" "$target" "set -eu; test ! -L /root/trbhh-release-tools; mkdir -m 700 -p '$remote_tools'; test ! -L '$remote_tools'"
          scp -i ~/.ssh/deploy_key -P "$port" -o StrictHostKeyChecking=yes \
            scripts/release/salla-catalog-quarantine{,-plan}.cjs "$target:$remote_tools/"
          ssh "${ssh_args[@]}" "$target" "set -eu; cd /root/trbhh; container=\$(docker compose ps -q app); test -n \"\$container\"; docker cp '$remote_tools/salla-catalog-quarantine.cjs' \"\$container:/tmp/salla-catalog-quarantine.cjs\"; docker cp '$remote_tools/salla-catalog-quarantine-plan.cjs' \"\$container:/tmp/salla-catalog-quarantine-plan.cjs\"; docker compose exec -T -e NODE_PATH=/app/node_modules app node /tmp/salla-catalog-quarantine.cjs apply 79241bf63f377661c5e4f4913373c2903433bc0df027925955c8301cb3b7d825 QUARANTINE_DEMO_MERCHANT_1921390206"
