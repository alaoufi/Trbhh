name: تشخيص - إعلانات مميّزة/عاجلة لا تظهر في القوائم العامة

# أداة تشخيص عند الحاجة فقط: يجد كل الإعلانات المميّزة/العاجلة سارية المفعول
# حالياً، ويحدد لكل منها إن كانت ستُستبعد من قوائم تربح العامة بسبب عزل
# المتاجر (store_only بلا عرض مدفوع "في تربح" ساري)، لتشخيص سبب عدم ظهورها.
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: كتابة سكربت الاستعلام
        run: |
          cat > query.js << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const now = new Date();
            const featured = await p.ads.findMany({
              where: { status: 1, state: 'active', adsSpecial: 'checked', expires_at: { gt: now } },
              select: { id: true, title: true, user_id: true, store_only: true, trbhh_until: true, expires_at: true, urgent_until: true, created_at: true },
              orderBy: { id: 'desc' },
            });
            const urgent = await p.ads.findMany({
              where: { status: 1, state: 'active', urgent_until: { gt: now } },
              select: { id: true, title: true, user_id: true, store_only: true, trbhh_until: true, expires_at: true, urgent_until: true, created_at: true },
              orderBy: { id: 'desc' },
            });
            const byId = new Map();
            for (const r of [...featured, ...urgent]) byId.set(r.id.toString(), r);
            const rows = [...byId.values()];

            const hiddenByStoreIsolation = rows.filter((r) => r.store_only === 1 && !(r.trbhh_until && r.trbhh_until > now));

            console.log('===NOW===', now.toISOString());
            console.log('===FEATURED_ACTIVE_COUNT===', featured.length);
            console.log('===URGENT_ACTIVE_COUNT===', urgent.length);
            console.log('===TOTAL_UNIQUE===', rows.length);
            console.log('===HIDDEN_BY_STORE_ISOLATION_COUNT===', hiddenByStoreIsolation.length);
            console.log('===ALL_ROWS===');
            console.log(JSON.stringify(rows.map((r) => ({
              id: r.id.toString(),
              title: r.title,
              user_id: r.user_id.toString(),
              store_only: r.store_only,
              trbhh_until: r.trbhh_until,
              expires_at: r.expires_at,
              urgent_until: r.urgent_until,
              created_at: r.created_at,
              hiddenFromGeneralLists: r.store_only === 1 && !(r.trbhh_until && r.trbhh_until > now),
            })), null, 2));
            await p.$disconnect();
          })().catch((e) => { console.error('QUERY_FAILED:', e); process.exit(1); });
          EOF

      - name: الاستعلام عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/trbhh && docker compose exec -T app node" < query.js
