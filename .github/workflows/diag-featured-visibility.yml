name: تشخيص - إعلانات مميّزة/عاجلة لا تظهر في القوائم العامة

# أداة تشخيص عند الحاجة فقط: يفحص فرضية جديدة — سقف "مدة بقاء الإعلان"
# (ad_days) في باقة صاحب الإعلان، والذي يستبعد الإعلان من toCards() بعد
# مرور عدد الأيام هذا من created_at، بصرف النظر تماماً عن كونه مميّزاً/عاجلاً
# وسارياً (expires_at/urgent_until لا علاقة لهما بهذا الفلتر).
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: كتابة سكربت الاستعلام
        run: |
          cat > query.js << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const now = new Date();
            const featured = await p.ads.findMany({
              where: { status: 1, state: 'active', adsSpecial: 'checked', expires_at: { gt: now } },
              select: { id: true, title: true, user_id: true, created_at: true, expires_at: true },
              orderBy: { id: 'desc' },
            });
            const urgent = await p.ads.findMany({
              where: { status: 1, state: 'active', urgent_until: { gt: now } },
              select: { id: true, title: true, user_id: true, created_at: true, urgent_until: true },
              orderBy: { id: 'desc' },
            });
            const byId = new Map();
            for (const r of [...featured, ...urgent]) byId.set(r.id.toString(), r);
            const rows = [...byId.values()];

            // packages/user_packages ليستا في مخطط Prisma (تُداران بـ SQL خام في src/lib/packages.ts) — استعلام خام هنا أيضاً
            const pkgs = await p.$queryRawUnsafe(`SELECT id, name, ad_days, is_default, active FROM packages`).catch((e) => { throw new Error('PKGS_QUERY_FAILED: ' + e); });
            const defPkg = pkgs.find((pk) => pk.is_default === 1) || null;
            const userIds = [...new Set(rows.map((r) => Number(r.user_id)))];
            const subs = userIds.length
              ? await p.$queryRawUnsafe(
                  `SELECT user_id, package_id, expires_at FROM user_packages WHERE user_id IN (${userIds.map(() => '?').join(',')})`,
                  ...userIds
                ).catch((e) => ({ __error: String(e) }))
              : [];

            const out = [];
            for (const r of rows) {
              const uid = r.user_id.toString();
              const userSubs = Array.isArray(subs) ? subs.filter((s) => s.user_id.toString() === uid) : [];
              const activeSub = userSubs.find((s) => !s.expires_at || new Date(s.expires_at).getTime() > now.getTime());
              const pkg = activeSub ? pkgs.find((pk) => pk.id === activeSub.package_id) : null;
              const effectiveAdDays = pkg ? pkg.ad_days : (defPkg ? defPkg.ad_days : 0);
              const ageDays = (now.getTime() - new Date(r.created_at).getTime()) / 86400000;
              out.push({
                id: r.id.toString(),
                title: r.title,
                user_id: uid,
                created_at: r.created_at,
                ageDays: Math.round(ageDays * 10) / 10,
                usingPackage: pkg ? pkg.name : `(افتراضية: ${defPkg ? defPkg.name : '?'})`,
                effectiveAdDays,
                hiddenByAdDaysCap: !!effectiveAdDays && ageDays > effectiveAdDays,
              });
            }

            console.log('===NOW===', now.toISOString());
            console.log('===DEFAULT_PACKAGE===', JSON.stringify(defPkg));
            console.log('===ALL_PACKAGES===', JSON.stringify(pkgs));
            console.log('===ROWS===');
            console.log(JSON.stringify(out, null, 2));
            await p.$disconnect();
          })().catch((e) => { console.error('QUERY_FAILED:', e); process.exit(1); });
          EOF

      - name: الاستعلام عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/trbhh && docker compose exec -T app node" < query.js
