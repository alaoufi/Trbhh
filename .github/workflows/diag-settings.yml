name: تشخيص - كود الحاوية الحيّة

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: فحص كود الحاوية عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ]; then echo "no key"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            'cd /root/trbhh && echo "=== HOST GIT HEAD ===" && git rev-parse HEAD && echo "=== APP CONTAINER STATUS ===" && docker compose ps app && echo "=== idpkg in built code? ===" && docker compose exec -T app sh -c "grep -rl idpkg .next/server 2>/dev/null | head -3; echo ---; grep -rl max_profiles .next/server 2>/dev/null | head -3; echo ---; grep -rl identity_exempt .next/server 2>/dev/null | head -3" && echo "=== APP IMAGE CREATED ===" && docker inspect $(docker compose ps -q app) --format "{{.Created}} {{.Config.Image}}"'
