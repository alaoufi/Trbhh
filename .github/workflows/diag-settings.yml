name: تشخيص - قراءة إعدادات الباقات من الخادم

on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: كتابة سكربت الاستعلام
        run: |
          cat > query.js << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const keys = ['max_profiles','identity_exempt_days',
              'idpkg1_name','idpkg1_acc','idpkg1_m','idpkg1_h','idpkg1_y',
              'idpkg2_name','idpkg2_acc','idpkg2_m','idpkg2_h','idpkg2_y',
              'idpkg3_name','idpkg3_acc','idpkg3_m','idpkg3_h','idpkg3_y',
              'ad_lifetime_days','strike_ban_days'];
            const rows = await p.site_settings.findMany({ where: { k: { in: keys } } });
            console.log('===SETTINGS_START===');
            console.log(JSON.stringify(rows, null, 2));
            console.log('===SETTINGS_END===');
            // اختبار كتابة: عيّن قيمة ثم اقرأها
            await p.site_settings.upsert({ where: { k: 'diag_write_test' }, create: { k: 'diag_write_test', v: 'ok-'+Date.now() }, update: { v: 'ok-'+Date.now() } });
            const back = await p.site_settings.findUnique({ where: { k: 'diag_write_test' } });
            console.log('===WRITE_TEST===', JSON.stringify(back));
            await p.$disconnect();
          })().catch((e) => { console.error('QUERY_FAILED:', e); process.exit(1); });
          EOF

      - name: الاستعلام عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ]; then echo "no key"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/trbhh && docker compose exec -T app node" < query.js
