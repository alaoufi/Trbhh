name: تشخيص - سجل تطبيق الخادم

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: قراءة سجل التطبيق عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ]; then echo "no key"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            'cd /root/trbhh && echo "=== APP UPTIME ===" && docker compose ps app && echo "=== LAST 250 LOG LINES (filtered) ===" && docker compose logs --tail=400 app 2>&1 | grep -iE "error|unhandled|reject|prisma|settings|digest|Error:|at async|redirect|Body exceeded" | tail -90'
