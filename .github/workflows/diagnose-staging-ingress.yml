name: فحص مدخل معاينة التجريب

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/trbhh-platform-enhancement-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: فحص قرائي لأدوات HTTPS وإعدادات المدخل
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          port="${VPS_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=25 \
            "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          echo '=== tools ==='
          for command_name in nginx certbot acme.sh clpctl; do
            if command -v "$command_name" >/dev/null 2>&1; then
              printf '%s=%s\n' "$command_name" "$(command -v "$command_name")"
            else
              printf '%s=unavailable\n' "$command_name"
            fi
          done
          echo '=== nginx ==='
          nginx -t
          nginx -T 2>&1 | awk '/^# configuration file / {print}' | head -80
          echo '=== cloudpanel reverse proxy help ==='
          clpctl site:add:reverse-proxy --help 2>&1 | head -80 || true
          echo '=== cloudpanel certificate help ==='
          clpctl lets-encrypt:install:certificate --help 2>&1 | head -80 || true
          echo '=== preview hostname current response ==='
          curl -sSI --max-time 20 -H 'Host: preview.88-223-92-124.sslip.io' http://127.0.0.1/ | head -20
          REMOTE
