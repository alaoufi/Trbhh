name: تشخيص بيئة التجربة
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: فحص الخادم دون تعديل
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_DIR: ${{ secrets.STAGING_DIR }}
        run: |
          set -e
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          DIR="${STAGING_DIR:-/root/trbhh-staging}"
          timeout 45s ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" "set -e; echo '--- disk ---'; df -h /; echo '--- docker ---'; docker system df; echo '--- staging ---'; cd '$DIR'; docker compose -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml ps"
