name: Finance and RBAC release operations
on:
  workflow_call:
    inputs:
      phase:
        type: string
        default: inspect
      baseline_sha:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inspect, diagnose-backup, cache-audit, cache-cleanup]
        default: inspect
        required: true
      baseline_sha:
        description: Exact serving checkout SHA required for cache operations
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: vps-deploy
  cancel-in-progress: false
jobs:
  operate:
    if: github.ref == 'refs/heads/codex/finance-tax-audit-20260922' || github.ref == 'refs/heads/claude/hostinger-vps-project-amw8vb'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bounded cache operation tools
        run: |
          node --test scripts/release/finance-cache.test.cjs scripts/release/finance-backup-diagnose.test.cjs
          bash -n scripts/release/finance-cache.sh
      - name: Inspect production or run the selected guarded cache operation
        env:
          PHASE: ${{ inputs.phase || 'inspect' }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PHASE" =~ ^(inspect|diagnose-backup|cache-audit|cache-cleanup)$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          if [[ "$PHASE" == cache-* ]]; then [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
          test -n "$VPS_HOST"; test -n "$VPS_USER"; test -n "$VPS_SSH_KEY"; test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/finance_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          port=${VPS_PORT:-22}; [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( 10#$port > 0 && 10#$port <= 65535 ))
          SSH=(ssh -i ~/.ssh/finance_key -p "$port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=25 -o ServerAliveInterval=15)
          target="$VPS_USER@$VPS_HOST"
          if [[ "$PHASE" == diagnose-backup ]]; then
            "${SSH[@]}" "$target" 'node -' < scripts/release/finance-backup-diagnose.cjs
            exit 0
          fi
          if [[ "$PHASE" != inspect ]]; then
            "${SSH[@]}" "$target" "bash -s -- '$PHASE' '$GITHUB_RUN_ID' '$BASELINE_SHA'" < scripts/release/finance-cache.sh
            exit 0
          fi
          "${SSH[@]}" "$target" 'set -eu; cd /root/trbhh; printf "CHECKOUT="; git rev-parse HEAD; git status --short; docker compose ps; id=$(docker compose ps -q app); docker inspect -f "IMAGE={{.Image}} RUNNING={{.State.Running}}" "$id"; docker exec "$id" cat /app/.next/BUILD_ID; df -h /root; find /root/trbhh-release-backups -maxdepth 2 -name VERIFIED -printf "%h\n" | sort | tail -8'
          "${SSH[@]}" "$target" 'cd /root/trbhh && docker compose exec -T app node -' < scripts/release/finance-runtime-inspect.cjs
          "${SSH[@]}" "$target" 'node -' <<'PARENT_NODE'
          const fs=require('node:fs'),path=require('node:path');
          const parent='/root/trbhh-release-backups/audit-35603864905';
          let ok=false;
          try {
            const directory=fs.lstatSync(parent);
            if(!directory.isDirectory()||directory.isSymbolicLink()||fs.realpathSync(parent)!==parent||directory.uid!==0||(directory.mode&0o777)!==0o700)throw Error('parent_directory');
            for(const name of ['VERIFIED','commit.txt','DEPLOYMENT_VERIFIED','SHA256SUMS','container-after.json','database.sql.gz','code.tar.gz','image.tar.gz','storage.tar.gz','legacy.tar.gz','storage.path','legacy.path','storage-before.json','legacy-before.json']) {
              const info=fs.lstatSync(path.join(parent,name));
              if(!info.isFile()||info.isSymbolicLink()||info.nlink!==1)throw Error('parent_file');
            }
            for(const [name,expected] of [['VERIFIED','07d2e9ead8e0b28824102d5c8a31b097e01f9459'],['commit.txt','07d2e9ead8e0b28824102d5c8a31b097e01f9459'],['DEPLOYMENT_VERIFIED','5f8dbc01c38bf431a9ae099a581b80536097b346'],['storage.path','/app/storage'],['legacy.path','/app/legacy']]) {
              if(fs.readFileSync(path.join(parent,name),'utf8').trim()!==expected)throw Error('parent_marker');
            }
            ok=true;
          } catch {}
          let historicalSealOk=false, historicalSealSha256;
          try {
            const checkpoint='/root/trbhh-release-backups/audit-35607654850',info=fs.lstatSync(checkpoint);
            if(!info.isDirectory()||info.isSymbolicLink()||fs.realpathSync(checkpoint)!==checkpoint||info.uid!==0||(info.mode&0o777)!==0o700)throw Error('checkpoint_directory');
            for(const name of ['VERIFIED','commit.txt','candidate.txt','DEPLOYMENT_VERIFIED','SHA256SUMS','PARENT_MEDIA_REFERENCE.json','REUSED_MEDIA_SOURCE','storage.path','legacy.path','storage-before.json','legacy-before.json']) {
              const item=fs.lstatSync(path.join(checkpoint,name));if(!item.isFile()||item.isSymbolicLink()||item.nlink!==1)throw Error('checkpoint_file');
            }
            for(const [name,expected] of [['VERIFIED','5f8dbc01c38bf431a9ae099a581b80536097b346'],['commit.txt','5f8dbc01c38bf431a9ae099a581b80536097b346'],['candidate.txt','415a8fe593522859f4cf85c2fa10e47a7d40109b'],['DEPLOYMENT_VERIFIED','415a8fe593522859f4cf85c2fa10e47a7d40109b'],['REUSED_MEDIA_SOURCE','35603864905']]) {
              if(fs.readFileSync(path.join(checkpoint,name),'utf8').trim()!==expected)throw Error('checkpoint_marker');
            }
            historicalSealSha256=require('node:crypto').createHash('sha256').update(fs.readFileSync(path.join(checkpoint,'PARENT_MEDIA_REFERENCE.json'))).digest('hex');
            historicalSealOk=true;
          } catch {}
          console.log(JSON.stringify({financeMediaParentAvailable:ok,financeMediaHistoricalSealAvailable:historicalSealOk,historicalSealSha256}));
          if(!ok||!historicalSealOk)process.exitCode=1;
          PARENT_NODE
      - name: Remove runner SSH credential
        if: always()
        run: rm -f -- "$HOME/.ssh/finance_key"
