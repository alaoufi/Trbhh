name: Read-only category and supplier readiness
on:
  push:
    branches: [codex/home-feed-release-20260919]
    paths: ['.github/workflows/integration-readiness.yml', 'scripts/release/integration-readiness.cjs']
  workflow_dispatch:
    inputs:
      owner_invite:
        description: Issue the approved Salla owner invitation after verified deployment
        type: boolean
        default: false
      backup_id:
        description: Verified merchant OAuth release backup ID
        type: string
      report_public_key_b64:
        description: RSA public key for encrypted owner invitation output
        type: string
permissions:
  contents: read
  actions: read
jobs:
  finance-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/finance-tax-audit-20260922' && inputs.owner_invite != true
    uses: ./.github/workflows/finance-release.yml
    with:
      phase: inspect
    secrets: inherit
  inspect:
    if: inputs.owner_invite != true && github.ref != 'refs/heads/codex/finance-tax-audit-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read counts, category definitions and secret presence only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/key
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'cd /root/trbhh && docker compose exec -T app node -' < scripts/release/integration-readiness.cjs
  owner-invite:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_invite == true && (github.ref == 'refs/heads/codex/salla-owner-release-20260921' || (github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.backup_id == '35629850346') || (github.ref == 'refs/heads/codex/salla-customer-scope-sandbox-order-20260922' && inputs.backup_id == '35720454989'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    env:
      PRODUCTION_SHA: ${{ github.ref == 'refs/heads/codex/salla-customer-scope-sandbox-order-20260922' && '5dad593a7580de4fe0ec8d275283a33c321b36db' || (github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && '9a64552faca2b99e63a0e915ea73fd0989336b86' || github.sha) }}
      PRODUCTION_BASELINE_SHA: ${{ github.ref == 'refs/heads/codex/salla-customer-scope-sandbox-order-20260922' && '354d226ccf5bc80b92c67a227c2263ada1cdfa86' || '' }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ github.ref == 'refs/heads/codex/salla-customer-scope-sandbox-order-20260922' && '35720519825' || '' }}
      INVITATION_PROFILE: ${{ github.ref == 'refs/heads/codex/salla-customer-scope-sandbox-order-20260922' && 'customer_scope' || (github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && 'national_day' || 'merchant_oauth') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the reviewed invitation operation
        run: |
          set -euo pipefail
          if [[ "$INVITATION_PROFILE" == customer_scope ]]; then
            node --check scripts/release/salla-current-owner-invite.cjs
          elif [[ "$INVITATION_PROFILE" == national_day ]]; then
            git fetch --no-tags --depth=1 origin "$PRODUCTION_SHA"
            git diff --exit-code "$PRODUCTION_SHA" HEAD -- scripts/release/build-salla-owner-invite.cjs scripts/release/salla-owner-invite.ts src/lib/suppliers/merchant-oauth.ts src/lib/suppliers/config.ts src/lib/suppliers/crypto.ts src/lib/suppliers/http.ts src/lib/commerce/config.ts src/lib/commerce/money.ts
            pnpm install --frozen-lockfile
            node scripts/release/build-salla-owner-invite.cjs --output "$RUNNER_TEMP/salla-owner-invite.cjs"
          else
            pnpm install --frozen-lockfile
            node scripts/release/build-salla-owner-invite.cjs --output "$RUNNER_TEMP/salla-owner-invite.cjs"
          fi
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      - name: Issue invitation only after exact release and backup verification
        if: env.INVITATION_PROFILE != 'customer_scope'
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          REPORT_PUBLIC_KEY_B64: ${{ inputs.report_public_key_b64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPORT_PUBLIC_KEY_B64" =~ ^[A-Za-z0-9+/=]+$ ]]
          test ${#REPORT_PUBLIC_KEY_B64} -lt 12000
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/key
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          { printf "process.env.SALLA_AUDIT_REPORT_PUBLIC_KEY_B64='%s';\n" "$REPORT_PUBLIC_KEY_B64"; cat "$RUNNER_TEMP/salla-owner-invite.cjs"; } > "$RUNNER_TEMP/issue.cjs"
          remote_tools="/root/trbhh-release-tools/$PRODUCTION_SHA"
          ssh_args=(-i ~/.ssh/key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o ConnectTimeout=25)
          target="$VPS_USER@$VPS_HOST"
          ssh "${ssh_args[@]}" "$target" "test -d '$remote_tools'; test ! -L '$remote_tools'"
          scp -i ~/.ssh/key -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes scripts/release/issue-owner-invite.sh "$target:$remote_tools/"
          ssh "${ssh_args[@]}" "$target" "bash '$remote_tools/issue-owner-invite.sh' '$PRODUCTION_SHA' '$BACKUP_ID' '$INVITATION_PROFILE'" < "$RUNNER_TEMP/issue.cjs"
      - name: Issue the real-store invitation after the current backup proof
        if: env.INVITATION_PROFILE == 'customer_scope'
        env:
          BACKUP_RUN_ID: ${{ inputs.backup_id }}
          REPORT_PUBLIC_KEY_B64: ${{ inputs.report_public_key_b64 }}
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_RUN_ID" == '35720454989' ]]
          [[ "$REPORT_PUBLIC_KEY_B64" =~ ^[A-Za-z0-9+/=]+$ ]]
          test ${#REPORT_PUBLIC_KEY_B64} -lt 12000
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" |
            jq -e --arg sha "$PRODUCTION_BASELINE_SHA" '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .event == "workflow_dispatch" and .path == ".github/workflows/fetch-full-backup.yml"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_DEPLOY_RUN_ID/attempts/2" |
            jq -e --arg sha "$PRODUCTION_SHA" '.status == "completed" and .conclusion == "success" and .head_sha == $sha and .event == "push" and .path == ".github/workflows/deploy.yml"' >/dev/null
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/key ~/.ssh/known_hosts
          ssh_args=(-i ~/.ssh/key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=25)
          target="$VPS_USER@$VPS_HOST"
          remote_tools="/root/trbhh-release-tools/current-owner-$GITHUB_RUN_ID"
          ssh "${ssh_args[@]}" "$target" "set -eu; test \"\$(git -C /root/trbhh rev-parse HEAD)\" = '$PRODUCTION_SHA'; mkdir -m 700 -p '$remote_tools'; test ! -L '$remote_tools'"
          scp -i ~/.ssh/key -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts scripts/release/salla-current-owner-invite.cjs "$target:$remote_tools/"
          ssh "${ssh_args[@]}" "$target" "set -eu; cd /root/trbhh; container=\$(docker compose ps -q app); test -n \"\$container\"; test \"\$(docker inspect -f '{{.State.Running}} {{.State.Paused}}' \"\$container\")\" = 'true false'; docker cp '$remote_tools/salla-current-owner-invite.cjs' \"\$container:/tmp/salla-current-owner-invite.cjs\"; docker compose exec -T -e NODE_PATH=/app/node_modules -e SALLA_AUDIT_REPORT_PUBLIC_KEY_B64='$REPORT_PUBLIC_KEY_B64' app node /tmp/salla-current-owner-invite.cjs; docker exec -u 0 \"\$container\" rm -f /tmp/salla-current-owner-invite.cjs; rm -rf '$remote_tools'"
