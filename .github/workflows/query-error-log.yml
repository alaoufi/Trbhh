name: تشخيص - قراءة سجل الأخطاء التقنية من الخادم

# أداة تشخيص عند الحاجة فقط: يتصل بالخادم عبر SSH ويستعلم جدول error_log
# مباشرة عبر Prisma داخل حاوية app (تستخدم DATABASE_URL الحقيقي المضبوط
# على الخادم تلقائياً) ويطبع أحدث السجلات في مخرجات هذه الوظيفة.
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: كتابة سكربت الاستعلام
        run: |
          cat > query.js << 'EOF'
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const total = await p.error_log.count();
            const rows = await p.error_log.findMany({ orderBy: { id: 'desc' }, take: 200 });
            const groups = new Map();
            for (const r of rows) {
              const key = (r.digest || r.message || '').slice(0, 120);
              if (!groups.has(key)) groups.set(key, { count: 0, message: r.message, digest: r.digest, url: r.url, first_id: r.id, last_at: r.created_at });
              groups.get(key).count++;
            }
            console.log('===TOTAL_COUNT===', total);
            console.log('===GROUPED_START===');
            console.log(JSON.stringify([...groups.values()], (k, v) => (typeof v === 'bigint' ? v.toString() : v), 2));
            console.log('===GROUPED_END===');
            console.log('===ERROR_LOG_START===');
            console.log(JSON.stringify(rows, (k, v) => (typeof v === 'bigint' ? v.toString() : v), 2));
            console.log('===ERROR_LOG_END===');
            await p.$disconnect();
          })().catch((e) => { console.error('QUERY_FAILED:', e); process.exit(1); });
          EOF

      - name: الاستعلام عبر SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ السرّ VPS_SSH_KEY غير موجود."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_PORT:-22}"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/trbhh && docker compose exec -T app node" < query.js
