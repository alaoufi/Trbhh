name: تحقق حفظ بيانات تربح قبل وبعد الإصدار
on:
  push:
    branches: [codex/trbhh-audit-fixes-20260910]
    paths: ['scripts/release/**', '.github/workflows/release-safeguards.yml']
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [before, after, salla_prepare, salla_activate, salla_rollback]
        default: before
        required: true
      backup_id:
        description: Previous successful safeguards run ID (required for after)
        type: string
      reuse_media_id:
        description: Optional source run ID for media archives only (before phase; database is always fresh)
        type: string
      candidate_sha:
        description: Exact already-deployed candidate for the reviewed onboarding after-proof only
        type: string
permissions:
  contents: read
concurrency:
  group: vps-deploy
  cancel-in-progress: false
jobs:
  salla:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/salla-release-20260920' && startsWith(inputs.phase, 'salla_')
    uses: ./.github/workflows/salla-release-prepare.yml
    with:
      phase: ${{ inputs.phase }}
      backup_id: ${{ inputs.backup_id }}
      confirmation: PREPARE_SALLA_WITH_MAINTENANCE_BACKUP
    secrets: inherit
  safeguard:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/trbhh-audit-fixes-20260910' || github.ref == 'refs/heads/claude/hostinger-vps-project-amw8vb' || (github.ref == 'refs/heads/codex/trbhh-v2-preview' && github.event_name == 'workflow_dispatch' && inputs.phase == 'before') || (github.ref == 'refs/heads/codex/commerce-approved-goods-20260919' && inputs.phase == 'before') || (github.ref == 'refs/heads/codex/home-feed-release-20260919' && inputs.phase == 'before') || (github.ref == 'refs/heads/codex/salla-owner-release-20260921' && (inputs.phase == 'before' || inputs.phase == 'after')) || (github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && (inputs.phase == 'before' || inputs.phase == 'after')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Private backup or post-release comparison on the VPS
        env:
          PHASE: ${{ inputs.phase || 'before' }}
          BACKUP_ID: ${{ inputs.backup_id || github.run_id }}
          REUSE_MEDIA_ID: ${{ inputs.reuse_media_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          RELEASE_PROFILE: ${{ github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35653890678' && 'onboarding_audit_compact' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35651818861' && 'onboarding_legacy_identity' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35649868888' && 'onboarding_legacy_email' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35644711205' && 'onboarding_template' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35642667045' && 'onboarding_link' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35640414518' && 'banner_separation' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35637559322' && 'supplier_admin' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35634930527' && 'national_day_loyalty' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35629850346' && 'national_day_immersive' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35626587686' && 'national_day' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && inputs.reuse_media_id == '35619790007' && 'public_home' || github.ref == 'refs/heads/codex/supplier-visual-selection-20260921' && 'supplier_selection' || github.ref == 'refs/heads/codex/salla-owner-release-20260921' && inputs.reuse_media_id == '35603864905' && 'merchant_headers' || github.ref == 'refs/heads/codex/salla-owner-release-20260921' && 'merchant_oauth' || 'standard' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_ID" =~ ^[0-9]+$ ]]
          [[ "$PHASE" == before || "$PHASE" == after ]]
          if [[ -n "${{ inputs.candidate_sha }}" ]]; then
            [[ "$PHASE" == after && "$RELEASE_PROFILE" == onboarding_link && "$CANDIDATE_SHA" == 408fb10d18ddad9f83259ffd8d006e441e6a6515 ]]
          fi
          if [[ "$RELEASE_PROFILE" == onboarding_audit_compact ]]; then
            [[ "$REUSE_MEDIA_ID" == 35653890678 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == onboarding_legacy_identity ]]; then
            [[ "$REUSE_MEDIA_ID" == 35651818861 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == onboarding_legacy_email ]]; then
            [[ "$REUSE_MEDIA_ID" == 35649868888 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == onboarding_template ]]; then
            [[ "$REUSE_MEDIA_ID" == 35644711205 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == onboarding_link ]]; then
            [[ "$REUSE_MEDIA_ID" == 35642667045 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == banner_separation ]]; then
            [[ "$REUSE_MEDIA_ID" == 35640414518 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == supplier_admin ]]; then
            [[ "$REUSE_MEDIA_ID" == 35637559322 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == national_day_loyalty ]]; then
            [[ "$REUSE_MEDIA_ID" == 35634930527 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == supplier_selection ]]; then
            [[ "$REUSE_MEDIA_ID" == 35607654850 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == public_home ]]; then
            [[ "$REUSE_MEDIA_ID" == 35619790007 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == national_day_immersive ]]; then
            [[ "$REUSE_MEDIA_ID" == 35629850346 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          elif [[ "$RELEASE_PROFILE" == national_day ]]; then
            [[ "$REUSE_MEDIA_ID" == 35626587686 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          fi
          if [[ -n "$REUSE_MEDIA_ID" ]]; then
            if [[ "$RELEASE_PROFILE" == onboarding_audit_compact ]]; then
              [[ "$REUSE_MEDIA_ID" == 35653890678 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == onboarding_legacy_identity ]]; then
              [[ "$REUSE_MEDIA_ID" == 35651818861 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == onboarding_legacy_email ]]; then
              [[ "$REUSE_MEDIA_ID" == 35649868888 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == onboarding_template ]]; then
              [[ "$REUSE_MEDIA_ID" == 35644711205 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == onboarding_link ]]; then
              [[ "$REUSE_MEDIA_ID" == 35642667045 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == banner_separation ]]; then
              [[ "$REUSE_MEDIA_ID" == 35640414518 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == supplier_admin ]]; then
              [[ "$REUSE_MEDIA_ID" == 35637559322 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == national_day_loyalty ]]; then
              [[ "$REUSE_MEDIA_ID" == 35634930527 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == supplier_selection ]]; then
              [[ "$REUSE_MEDIA_ID" == 35607654850 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == public_home ]]; then
              [[ "$REUSE_MEDIA_ID" == 35619790007 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == national_day_immersive ]]; then
              [[ "$REUSE_MEDIA_ID" == 35629850346 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == national_day ]]; then
              [[ "$REUSE_MEDIA_ID" == 35626587686 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            elif [[ "$RELEASE_PROFILE" == merchant_headers ]]; then
              [[ "$REUSE_MEDIA_ID" == 35603864905 && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            else
              [[ "$PHASE" == before && "$REUSE_MEDIA_ID" =~ ^[0-9]+$ && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
            fi
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/release_key
          port=${VPS_PORT:-22}
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_args=(-i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes -o ConnectTimeout=25 -o ServerAliveInterval=15)
          target="$VPS_USER@$VPS_HOST"
          remote_tools="/root/trbhh-release-tools/$GITHUB_SHA"
          ssh "${ssh_args[@]}" "$target" "set -eu; test ! -L /root/trbhh-release-tools; mkdir -p '$remote_tools'; chmod 700 /root/trbhh-release-tools '$remote_tools'"
          scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes scripts/release/{safeguards.sh,database-proof.cjs,verify-runtime.cjs,media-proof.cjs,supplier-preservation-proof.cjs,backup-capacity-proof.cjs,merchant-media-reference.cjs,selection-media-reference.cjs,home-media-reference.cjs,selection-operational-attestation.cjs,national-media-reference.cjs,immersive-media-reference.cjs,loyalty-media-reference.cjs,supplier-admin-media-reference.cjs,banner-separation-media-reference.cjs,onboarding-link-media-reference.cjs,onboarding-template-media-reference.cjs,onboarding-legacy-email-media-reference.cjs,onboarding-legacy-identity-media-reference.cjs,onboarding-audit-compact-media-reference.cjs,public-home-supplier-forensics.cjs} "$target:$remote_tools/"
          ssh "${ssh_args[@]}" "$target" "bash '$remote_tools/safeguards.sh' '$PHASE' '$BACKUP_ID' '$CANDIDATE_SHA' '$REUSE_MEDIA_ID' '$RELEASE_PROFILE'"
