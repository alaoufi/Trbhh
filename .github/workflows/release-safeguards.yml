name: تحقق حفظ بيانات تربح قبل وبعد الإصدار
on:
  push:
    branches: [codex/trbhh-audit-fixes-20260910]
    paths: ['scripts/release/**', '.github/workflows/release-safeguards.yml']
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [before, after, salla_prepare, salla_activate, salla_rollback]
        default: before
        required: true
      backup_id:
        description: Previous successful safeguards run ID (required for after)
        type: string
      reuse_media_id:
        description: Optional source run ID for media archives only (before phase; database is always fresh)
        type: string
permissions:
  contents: read
concurrency:
  group: vps-deploy
  cancel-in-progress: false
jobs:
  salla:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/salla-release-20260920' && startsWith(inputs.phase, 'salla_')
    uses: ./.github/workflows/salla-release-prepare.yml
    with:
      phase: ${{ inputs.phase }}
      backup_id: ${{ inputs.backup_id }}
      confirmation: PREPARE_SALLA_WITH_MAINTENANCE_BACKUP
    secrets: inherit
  safeguard:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/codex/trbhh-audit-fixes-20260910' || github.ref == 'refs/heads/claude/hostinger-vps-project-amw8vb' || (github.ref == 'refs/heads/codex/trbhh-v2-preview' && github.event_name == 'workflow_dispatch' && inputs.phase == 'before') || (github.ref == 'refs/heads/codex/commerce-approved-goods-20260919' && inputs.phase == 'before') || (github.ref == 'refs/heads/codex/home-feed-release-20260919' && inputs.phase == 'before') || (github.ref == 'refs/heads/codex/salla-owner-release-20260921' && (inputs.phase == 'before' || inputs.phase == 'after')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Private backup or post-release comparison on the VPS
        env:
          PHASE: ${{ inputs.phase || 'before' }}
          BACKUP_ID: ${{ inputs.backup_id || github.run_id }}
          REUSE_MEDIA_ID: ${{ inputs.reuse_media_id }}
          RELEASE_PROFILE: ${{ github.ref == 'refs/heads/codex/salla-owner-release-20260921' && 'merchant_oauth' || 'standard' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_ID" =~ ^[0-9]+$ ]]
          [[ "$PHASE" == before || "$PHASE" == after ]]
          if [[ -n "$REUSE_MEDIA_ID" ]]; then
            [[ "$PHASE" == before && "$REUSE_MEDIA_ID" =~ ^[0-9]+$ && "$REUSE_MEDIA_ID" != "$BACKUP_ID" ]]
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/release_key
          port=${VPS_PORT:-22}
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_args=(-i ~/.ssh/release_key -p "$port" -o StrictHostKeyChecking=yes -o ConnectTimeout=25 -o ServerAliveInterval=15)
          target="$VPS_USER@$VPS_HOST"
          remote_tools="/root/trbhh-release-tools/$GITHUB_SHA"
          ssh "${ssh_args[@]}" "$target" "set -eu; test ! -L /root/trbhh-release-tools; mkdir -p '$remote_tools'; chmod 700 /root/trbhh-release-tools '$remote_tools'"
          scp -i ~/.ssh/release_key -P "$port" -o StrictHostKeyChecking=yes scripts/release/{safeguards.sh,database-proof.cjs,verify-runtime.cjs,media-proof.cjs,supplier-preservation-proof.cjs,backup-capacity-proof.cjs} "$target:$remote_tools/"
          ssh "${ssh_args[@]}" "$target" "bash '$remote_tools/safeguards.sh' '$PHASE' '$BACKUP_ID' '$GITHUB_SHA' '$REUSE_MEDIA_ID' '$RELEASE_PROFILE'"
