name: الفحص الأمني

# بوابة أمنية: Semgrep على الشيفرة كاملة، وZAP سلبي + فحص صلاحيات على نسخة محلية معزولة
# ببيانات مصطنعة داخل مشغّل GitHub. لا يتصل بالإنتاج ولا يستخدم أي سر من أسرار المستودع.
# يفشل إذا وُجدت نتيجة حرجة/عالية غير مفروزة في security/triage.json.
on:
  push:
    branches: [claude/hostinger-vps-project-amw8vb]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep — تحليل الشيفرة
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: تثبيت Semgrep بالإصدار المثبّت
        run: |
          . security/versions.env
          python -m pip install --disable-pip-version-check "semgrep==$SEMGREP_VERSION"
      - name: فحص الشيفرة
        run: security/semgrep.sh "$RUNNER_TEMP/semgrep.json"
      - name: التصنيف والبوابة
        run: python security/report.py --semgrep "$RUNNER_TEMP/semgrep.json" --sha "$GITHUB_SHA" --out-dir "$RUNNER_TEMP/security-report" --gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with: { name: security-report-semgrep, path: '${{ runner.temp }}/security-report', retention-days: 90 }

  zap:
    name: ZAP سلبي + صلاحيات — نسخة محلية معزولة
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: trbhh_preview_audit
          MYSQL_ROOT_PASSWORD: security_ci_root
          MYSQL_ROOT_HOST: '%'
        ports: ['33399:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecurity_ci_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports: ['63799:6379']
    env:
      DATABASE_URL: mysql://root:security_ci_root@127.0.0.1:33399/trbhh_preview_audit
      REDIS_URL: redis://127.0.0.1:63799
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile
        env: { NODE_ENV: development }
      - name: مخطط وبيانات مصطنعة (لا بيانات إنتاج)
        run: |
          pnpm prisma db push --skip-generate
          pw="Zx!$(openssl rand -base64 18 | tr -d '/+=')"
          echo "::add-mask::$pw"
          echo "PREVIEW_LOGIN_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          PREVIEW_LOGIN_PASSWORD="$pw" node scripts/preview/seed.mjs
      - name: بناء وتشغيل النسخة المحلية
        run: |
          pnpm build
          nohup pnpm exec next start -p 3100 -H 127.0.0.1 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3100/ && exit 0; sleep 2; done
          tail -40 "$RUNNER_TEMP/app.log"; exit 1
      - name: ZAP — فحص سلبي
        run: security/zap-local.sh http://127.0.0.1:3100 "$RUNNER_TEMP/zap" zap-baseline
      - name: فحص الصلاحيات بحسابات الاختبار
        run: |
          pnpm exec playwright install --with-deps chromium
          BASE=http://127.0.0.1:3100 node security/authz-probe.cjs "$RUNNER_TEMP/zap/authz.json"
      - name: التصنيف والبوابة
        if: ${{ !cancelled() }}
        run: python3 security/report.py --zap "$RUNNER_TEMP/zap/zap-baseline.json" --sha "$GITHUB_SHA" --out-dir "$RUNNER_TEMP/security-report" --gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with: { name: security-report-zap, path: '${{ runner.temp }}/security-report', retention-days: 90 }
