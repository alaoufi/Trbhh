name: Trbhh backup storage maintenance
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, cleanup]
        default: audit
        required: true
permissions:
  contents: read
concurrency:
  group: vps-deploy
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect or clean only validated backup paths
        env:
          MODE: ${{ inputs.mode || 'audit' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/key
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o ConnectTimeout=25 -o ServerAliveInterval=15 "$VPS_USER@$VPS_HOST" bash -s -- "$MODE" < scripts/release/storage-maintenance.sh
