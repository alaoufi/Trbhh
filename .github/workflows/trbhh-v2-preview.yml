name: TRBHH V2 preview
on:
  workflow_dispatch:
    inputs:
      sandbox_access:
        description: 'Synchronize only the two synthetic V2 sandbox logins, with a backup'
        required: true
        default: false
        type: boolean
      sandbox_deploy:
        description: 'Deploy isolated writable sandbox with public snapshot; never production'
        required: true
        default: false
        type: boolean
      inspect_live:
        description: 'Read-only infrastructure inventory for isolated live preview'
        required: true
        default: false
        type: boolean
      live_snapshot:
        description: 'Export public production ads read-only (no deploy or database writes)'
        required: true
        default: false
        type: boolean
  push:
    branches: [codex/trbhh-v2-preview]
    paths: ['preview-v2/**', '.github/workflows/trbhh-v2-preview.yml']
  pull_request:
    paths: ['preview-v2/**', '.github/workflows/trbhh-v2-preview.yml']
jobs:
  sandbox-access:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/trbhh-v2-preview' && inputs.sandbox_access && !inputs.sandbox_deploy
    concurrency:
      group: trbhh-preview-v2-sandbox
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: mysql://preview:unused@127.0.0.1:3306/trbhh_preview_v2
      - name: Require exact-commit CI before changing sandbox access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')
            if [[ "$result" == $'completed\tsuccess' ]]; then exit 0; fi
            if [[ "$result" == completed* ]]; then echo 'CI did not pass'; exit 1; fi
            sleep 10
          done
          exit 1
      - name: Back up and synchronize only synthetic sandbox accounts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PREVIEW_LOGIN_PASSWORD: ${{ secrets.TRBHH_V2_SANDBOX_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/sandbox-key"
          known="$RUNNER_TEMP/sandbox-known"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known"
          port="${VPS_PORT:-22}"
          ssh_args=(-i "$key" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=25)
          target="$VPS_USER@$VPS_HOST"
          hash=$(node -e 'const b=require("bcryptjs"),p=process.env.PREVIEW_LOGIN_PASSWORD;if(!p||p.length<12||Buffer.byteLength(p)>72)process.exit(1);b.hash(p,12).then(h=>process.stdout.write(h));')
          echo "::add-mask::$hash"
          ssh "${ssh_args[@]}" "$target" "set -eu; umask 077; cd /root/trbhh-preview-v2; test ! -L /root/trbhh-preview-v2; test \"\$(cat .preview-only)\" = trbhh-preview-v2; test ! -L backups; mkdir -p backups; test ! -e backups/access-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sql; docker compose -p trbhh-preview-v2 -f compose.yml exec -T preview-db sh -c 'MYSQL_PWD=\"\$MYSQL_PASSWORD\" mysqldump --single-transaction --no-tablespaces -upreview trbhh_preview_v2' > backups/access-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sql"
          ssh "${ssh_args[@]}" "$target" "set -eu; cd /root/trbhh-preview-v2; test \"\$(cat .preview-only)\" = trbhh-preview-v2; docker compose -p trbhh-preview-v2 -f compose.yml exec -T -e PREVIEW_LOGIN_HASH='$hash' preview-app node -" < scripts/preview-v2/reset-login.cjs
          ssh "${ssh_args[@]}" "$target" 'cat /root/trbhh-preview-v2/preview-url.txt' > "$RUNNER_TEMP/sandbox-access-url"
      - name: Verify saved login through external HTTPS
        env:
          PREVIEW_LOGIN_PASSWORD: ${{ secrets.TRBHH_V2_SANDBOX_PASSWORD }}
        run: |
          pnpm exec playwright install --with-deps chromium
          export PREVIEW_VERIFY_URL="$(cat "$RUNNER_TEMP/sandbox-access-url")/"
          node tests/browser/preview-sandbox-external.mjs
  sandbox:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/trbhh-v2-preview' && inputs.sandbox_deploy
    needs: preview
    concurrency:
      group: trbhh-preview-v2-sandbox
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: trbhh_preview_v2
          MYSQL_USER: preview
          MYSQL_PASSWORD: preview_ci_only
          MYSQL_ROOT_PASSWORD: preview_ci_root_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -upreview -ppreview_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://preview:preview_ci_only@127.0.0.1:3306/trbhh_preview_v2
      AUTH_SECRET: sandbox_build_secret_only_0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Export only public data via existing connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/sandbox-ssh" "$RUNNER_TEMP/sandbox-data"
          key="$RUNNER_TEMP/sandbox-ssh/key"
          known="$RUNNER_TEMP/sandbox-ssh/known"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          port="${VPS_PORT:-22}"
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=20 -i "$key" -p "$port" "$VPS_USER@$VPS_HOST" \
            'cd /root/trbhh && docker compose exec -T -e SNAPSHOT_SOURCE_COMMIT="$(git rev-parse HEAD)" app node' \
            < preview-v2/scripts/export-public-snapshot.cjs > "$RUNNER_TEMP/sandbox-data/public-snapshot.json"
      - name: Prepare isolated database and local public photos
        env:
          PREVIEW_LOGIN_PASSWORD: ${{ secrets.TRBHH_V2_SANDBOX_PASSWORD }}
        run: |
          set -euo pipefail
          export TRBHH_SNAPSHOT_FILE="$RUNNER_TEMP/sandbox-data/public-snapshot.json"
          export PREVIEW_MEDIA_DIR="$RUNNER_TEMP/sandbox-data/media"
          export PREVIEW_MEDIA_MANIFEST="$PREVIEW_MEDIA_DIR/manifest.json"
          node scripts/preview-v2/prepare-public-media.mjs "$TRBHH_SNAPSHOT_FILE" "$PREVIEW_MEDIA_DIR"
          pnpm prisma db push --skip-generate
          node scripts/preview-v2/seed.mjs
          node scripts/preview-v2/import-public-snapshot.mjs
          mkdir -p public/snapshot-media
          cp -a "$PREVIEW_MEDIA_DIR/snapshot-media/." public/snapshot-media/
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Build original template for sandbox
        run: pnpm build
        env:
          PREVIEW_SANDBOX: 'true'
      - name: Verify database-backed sandbox in browser
        env:
          PREVIEW_LOGIN_PASSWORD: ${{ secrets.TRBHH_V2_SANDBOX_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          PREVIEW_SANDBOX=true pnpm start --hostname 127.0.0.1 --port 4192 > "$RUNNER_TEMP/sandbox-server.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4192/login -o /dev/null && break || sleep 2; done
          PREVIEW_TEST_BASE=http://127.0.0.1:4192 node tests/browser/preview-sandbox-runtime.mjs
      - name: Require passing CI for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')
            if [[ "$result" == $'completed\tsuccess' ]]; then exit 0; fi
            if [[ "$result" == completed* ]]; then echo 'CI did not pass'; exit 1; fi
            sleep 10
          done
          echo 'CI success not verified'; exit 1
      - name: Package isolated release
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          mkdir -p bundle/app/.next
          cp -a .next/standalone/. bundle/app/
          cp -a .next/static bundle/app/.next/static
          cp -a public bundle/app/public
          cp scripts/preview-v2/{Dockerfile.preview,compose.yml,nginx.conf,deploy.sh} bundle/
          docker exec -e MYSQL_PWD=preview_ci_only "$MYSQL_CONTAINER" mysqldump --single-transaction --no-tablespaces --set-gtid-purged=OFF -upreview trbhh_preview_v2 > bundle/preview.sql
          tar -czf preview-v2-bundle.tgz -C bundle .
      - name: Deploy only dedicated sandbox project
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/sandbox-ssh/key"
          known="$RUNNER_TEMP/sandbox-ssh/known"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          port="${VPS_PORT:-22}"
          ssh_args=(-i "$key" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=25 -o ServerAliveInterval=15)
          target="$VPS_USER@$VPS_HOST"
          ssh "${ssh_args[@]}" "$target" 'set -eu; p=/root/trbhh-preview-v2; test ! -L "$p"; if test -e "$p"; then test -f "$p/.preview-only" && test "$(cat "$p/.preview-only")" = trbhh-preview-v2; else mkdir -m 700 "$p"; printf "trbhh-preview-v2\n" > "$p/.preview-only"; fi; test "$(realpath "$p")" = "$p"; test ! -L "$p/releases"; mkdir -p "$p/releases"'
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scp -i "$key" -P "$port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" preview-v2-bundle.tgz "$target:/root/trbhh-preview-v2/incoming-$release.tgz"
          ssh "${ssh_args[@]}" "$target" "set -eu; cd /root/trbhh-preview-v2; test ! -e releases/$release; mkdir releases/$release; tar -xzf incoming-$release.tgz -C releases/$release; bash releases/$release/deploy.sh $release" | tee "$RUNNER_TEMP/sandbox-deploy.log"
          url=$(sed -n 's/^PREVIEW_URL=//p' "$RUNNER_TEMP/sandbox-deploy.log" | tail -1)
          test -n "$url"
          printf '### معاينة مستقلة قابلة للحفظ\n\n[%s](%s)\n\nبيانات عامة من لقطة مؤرخة؛ حسابات اختبار فقط.\n' "$url" "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify external HTTPS preview without modifying saved data
        env:
          PREVIEW_LOGIN_PASSWORD: ${{ secrets.TRBHH_V2_SANDBOX_PASSWORD }}
        run: |
          export PREVIEW_VERIFY_URL="$(sed -n 's/^PREVIEW_URL=//p' "$RUNNER_TEMP/sandbox-deploy.log" | tail -1)/"
          node tests/browser/preview-sandbox-external.mjs
  inspect-live:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/trbhh-v2-preview' && inputs.inspect_live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime metadata and aggregate data read-only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/inspect-ssh"
          key="$RUNNER_TEMP/inspect-ssh/key"
          known="$RUNNER_TEMP/inspect-ssh/known"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          port="${VPS_PORT:-22}"
          test -n "$VPS_KNOWN_HOSTS"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=20 -i "$key" -p "$port" "$VPS_USER@$VPS_HOST" 'bash -s' < scripts/preview/inspect-live-runtime.sh
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=20 -i "$key" -p "$port" "$VPS_USER@$VPS_HOST" \
            'cd /root/trbhh && docker compose exec -T app node' < scripts/preview/audit-production.cjs
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preview-v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
  public-snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/trbhh-v2-preview' && inputs.live_snapshot
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read only public ads from the existing production app
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/snapshot-ssh" "$RUNNER_TEMP/public-snapshot"
          key="$RUNNER_TEMP/snapshot-ssh/key"
          known="$RUNNER_TEMP/snapshot-ssh/known_hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          port="${VPS_PORT:-22}"
          echo 'Stage: SSH host key discovery (no database access yet)'
          if ! ssh-keyscan -v -T 15 -p "$port" "$VPS_HOST" > "$known" 2> "$RUNNER_TEMP/snapshot-ssh/discovery.log"; then
            echo 'SSH discovery failed; sanitized connection diagnostics follow.'
            grep -Ei 'timeout|timed out|refused|resolve|no matching|invalid|closed|reset|unreachable|banner|failed|key_exchange' "$RUNNER_TEMP/snapshot-ssh/discovery.log" || true
            exit 1
          fi
          echo 'Stage: authenticated read-only export'
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=20 \
            -i "$key" -p "$port" "$VPS_USER@$VPS_HOST" \
            'cd /root/trbhh && docker compose exec -T -e SNAPSHOT_SOURCE_COMMIT="$(git rev-parse HEAD)" app node' \
            < preview-v2/scripts/export-public-snapshot.cjs > "$RUNNER_TEMP/public-snapshot/public-snapshot.json"
          node -e 'const fs=require("fs");const p=process.argv[1];const d=JSON.parse(fs.readFileSync(p,"utf8"));console.log("Read-only snapshot metadata:",d.count,"public ads; captured",d.capturedAt);if(d.mode!=="live"||!d.complete||d.count!==d.listings.length||!d.count)throw new Error("Public snapshot metadata/empty-result gate failed");' "$RUNNER_TEMP/public-snapshot/public-snapshot.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-ads-snapshot
          path: ${{ runner.temp }}/public-snapshot/public-snapshot.json
          retention-days: 1
          if-no-files-found: error
