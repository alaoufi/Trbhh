# ────────────────────────────────────────────────────────────────────────────
# بيئة التجريب (Staging) — نسخة تجريب معزولة تعمل بالتوازي مع الإنتاج على نفس الخادم.
#
# تعمل من دليل منفصل (/root/trbhh-staging) وبمشروع Docker منفصل (-p trbhh-staging)،
# فلا تتصادم مع حاويات الإنتاج (trbhh-app / trbhh-redis) ولا تمسّ قاعدة بياناته.
# كل الإعدادات الحسّاسة (قاعدة التجريب، المنفذ، الأسرار) من ملف .env الخاص بالتجريب.
#
# التشغيل اليدوي (احتياطي — النشر التلقائي عبر deploy-staging.yml):
#   cd /root/trbhh-staging
#   docker compose -p trbhh-staging -f docker-compose.yml -f docker-compose.staging.yml up -d --build app redis preview-tunnel
#
# ملاحظات العزل:
#   • container_name مختلف هنا → لا تصادم مع حاويات الإنتاج على نفس الخادم.
#   • المنفذ يأتي من APP_PORT في .env التجريب (ضَع 3081) → منفذ مستقل عن 3080 للإنتاج.
#   • الحجم (trbhh-storage) يُسبَق باسم المشروع تلقائياً (trbhh-staging_…) → وسائط منفصلة.
#   • DATABASE_URL في .env التجريب يجب أن يشير لقاعدة تجريب منفصلة (لا قاعدة الإنتاج!).
# ────────────────────────────────────────────────────────────────────────────
services:
  redis:
    container_name: trbhh-staging-redis

  app:
    container_name: trbhh-staging-app
    environment:
      CATEGORIES_DEFAULT_ENABLED: "${CATEGORIES_DEFAULT_ENABLED:-0}"
      STAGING_DATABASE_NAME: "${STAGING_DATABASE_NAME:-trbhhdb}"
      TRBHH_READ_ONLY_PREVIEW: "${TRBHH_READ_ONLY_PREVIEW:-0}"
      # Preview is accessed directly over HTTP on port 3081; Secure cookies would loop back to login.
      COOKIE_SECURE: "false"
    # المنفذ يُضبط من APP_PORT في .env التجريب (=3081). لا نضيف ports هنا حتى لا
    # تُدمَج قائمتا المنافذ فيُفتح منفذ الإنتاج أيضاً بالخطأ.

  # رابط HTTPS عام للمعاينة فقط. يستخدم اتصالاً خارجياً صادراً إلى Cloudflare،
  # لذلك لا يحتاج فتح منفذ جديد أو تعديل Nginx/CloudPanel الخاص بالإنتاج.
  preview-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: trbhh-staging-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      app:
        condition: service_started
    networks: [trbhh]
