# ────────────────────────────────────────────────────────────────────────────
# بيئة التجريب (Staging) — نسخة معزولة كلياً تعمل بالتوازي مع الإنتاج على نفس الخادم.
#
# دليل منفصل (/root/trbhh-staging) + مشروع Docker منفصل (-p trbhh-staging) +
# قاعدة بيانات خاصة بها (حاوية MySQL مستقلّة عبر profile «localdb») — لا تلمس
# قاعدة الإنتاج ولا بياناته إطلاقاً. كل الأسرار من ملف .env الخاص بالتجريب.
#
# التشغيل (يُبنى تلقائياً عبر deploy-staging.yml؛ يدوياً كاحتياطي):
#   cd /root/trbhh-staging
#   docker compose --profile localdb -p trbhh-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# العزل:
#   • أسماء الحاويات مختلفة (trbhh-staging-*) → لا تصادم مع حاويات الإنتاج.
#   • المنفذ من APP_PORT في .env التجريب (=3081) → مستقل عن 3080 للإنتاج.
#   • الحجوم تُسبَق باسم المشروع تلقائياً (trbhh-staging_…) → تخزين منفصل.
#   • قاعدة التجريب حاوية MySQL خاصة (db) → لا اتصال بقاعدة الإنتاج.
# ────────────────────────────────────────────────────────────────────────────
services:
  # قاعدة التجريب: حاوية MySQL مستقلّة (تُفعّل بـ --profile localdb). DATABASE_URL
  # في .env التجريب يُترك فارغاً ليعود التطبيق تلقائياً لهذه الحاوية (db:3306).
  db:
    container_name: trbhh-staging-db

  redis:
    container_name: trbhh-staging-redis

  app:
    container_name: trbhh-staging-app
    # المنفذ من APP_PORT في .env التجريب (=3081). لا نضيف ports هنا حتى لا تُدمَج
    # قائمتا المنافذ فيُفتح منفذ الإنتاج بالخطأ.
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
