services:
  # Bundled MySQL — used only for local/testing. When you connect the app to
  # your real (production) database via DATABASE_URL, this stays OFF.
  # Start it explicitly with:  docker compose --profile localdb up -d
  db:
    image: mysql:8.0
    container_name: trbhh-db
    restart: unless-stopped
    profiles: ["localdb"]
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${DB_NAME:-trbhhdb}
      MYSQL_USER: ${DB_USER:-trbhh}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [trbhh]

  redis:
    image: redis:7-alpine
    container_name: trbhh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./docker/redis-data:/data
    networks: [trbhh]

  app:
    build: { context: ., dockerfile: Dockerfile }
    container_name: trbhh-app
    restart: unless-stopped
    depends_on:
      redis: { condition: service_started }
    # Lets the container reach a MySQL running on the VPS host itself
    # (use DATABASE_URL host = host.docker.internal when the DB is on the same server).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Point to your real DB by setting DATABASE_URL in .env. Falls back to the
      # bundled `db` container (profile "localdb") for local testing.
      DATABASE_URL: "${DATABASE_URL:-mysql://${DB_USER:-trbhh}:${DB_PASSWORD:-changeme}@db:3306/${DB_NAME:-trbhhdb}}"
      REDIS_URL: "redis://redis:6379"
      AUTH_SECRET: ${AUTH_SECRET:-please_change_this_secret}
      # set to 'true' ONLY when serving over HTTPS (behind SSL). On http://IP:PORT keep false.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # LEGACY_MEDIA_BASE proxies media over HTTP from another origin. Leave EMPTY
      # once the domain points at this app (else /media would loop back to itself).
      LEGACY_MEDIA_BASE: ${LEGACY_MEDIA_BASE:-}
      # LEGACY_LOCAL_DIR: read-only mount of the original site's media dir, so old
      # ad images/videos are served locally (with HTTP Range) without copying.
      LEGACY_LOCAL_DIR: ${LEGACY_LOCAL_DIR:-}
      # NEXT_PUBLIC_MEDIA_BASE empty => media served same-origin via /media route.
      NEXT_PUBLIC_MEDIA_BASE: ${NEXT_PUBLIC_MEDIA_BASE:-}
      STORAGE_DIR: /app/storage
      # SMS/verification gateways are configured from the admin UI (stored in DB).
      # These envs are only first-run fallbacks. Provider: jawaly_v1 (default) uses
      # app_key/app_secret; legacy uses username/password.
      SMS_PROVIDER: ${SMS_PROVIDER:-jawaly_v1}
      SMS_URL: ${SMS_URL:-}
      SMS_USERNAME: ${SMS_USERNAME:-}
      SMS_PASSWORD: ${SMS_PASSWORD:-}
      SMS_SENDER: ${SMS_SENDER:-SouqAlhafta}
      SMS_UNICODE: ${SMS_UNICODE:-e}
      NODE_ENV: production
      # المنصّة العقارية المستقلّة (beta): =1 يجعل البيئة عقارية فقط (تنظيف بيانات الأرشيف
      # العام عند الإقلاع). فارغ في الإنتاج → لا تأثير على الموقع الحيّ.
      REALESTATE_ONLY: ${REALESTATE_ONLY:-}
      # كل الأوقات والتواريخ بتوقيت الرياض (+3)
      TZ: Asia/Riyadh
      # بيكسلات التتبع الإعلاني — اختيارية، كل منها يعمل فقط عند ضبط معرّفه
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      GOOGLE_ADS_ID: ${GOOGLE_ADS_ID:-}
      TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-}
      SNAP_PIXEL_ID: ${SNAP_PIXEL_ID:-}
    volumes:
      # Named volume (not a host bind mount) so it inherits the image's
      # nextjs-owned /app/storage — the non-root app user can write uploads,
      # and images persist across deploys.
      - trbhh-storage:/app/storage
      # Original site's media (haftastore/public) mounted read-only so legacy
      # ad images & videos resolve. Host path set via LEGACY_HOST_MEDIA in .env.
      - ${LEGACY_HOST_MEDIA:-/tmp}:/app/legacy:ro
    # Published directly on host port ${APP_PORT} so the app is reachable
    # without the bundled nginx (avoids clashing with an existing panel on 80/443).
    ports:
      - "${APP_PORT:-3080}:3000"
    expose: ["3000"]
    networks: [trbhh]

  # Optional reverse proxy (domain + SSL). Disabled by default to avoid port
  # conflicts with control panels (CloudPanel/aaPanel) already using 80/443.
  # Enable with:  docker compose --profile nginx up -d
  nginx:
    image: nginx:alpine
    container_name: trbhh-nginx
    restart: unless-stopped
    profiles: ["nginx"]
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    networks: [trbhh]

volumes:
  # persistent uploaded media (ad/classified/promo images)
  trbhh-storage:

networks:
  trbhh:
    driver: bridge
