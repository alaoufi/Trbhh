# Trbhh — reverse proxy to the Next.js app.
# HTTP: serves ACME challenges and (after SSL setup) redirects to HTTPS.
# `*.trbhh.com` routes store subdomains (saud.trbhh.com) to the app; the app's
# middleware maps the subdomain to the matching store page.
server {
    listen 80;
    server_name trbhh.com www.trbhh.com *.trbhh.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Until certificates exist, comment the redirect and proxy directly.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # After running scripts/init-ssl.sh, replace the location / above with:
    # return 301 https://$host$request_uri;
}

# HTTPS — enabled after certificates are issued (see scripts/init-ssl.sh).
# For store subdomains add `*.trbhh.com` to server_name AND issue a wildcard
# certificate (see docs/SUBDOMAINS.md) — the default HTTP-01 cert covers only
# the exact names, so subdomains need a DNS-01 wildcard cert.
