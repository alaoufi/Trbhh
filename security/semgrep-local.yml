# قواعد محلية خاصة بتربح — تعمل بلا إنترنت، ويستخدمها فحص Claude Code الخفيف والفحص الكامل.
rules:
  - id: trbhh-gcm-decipher-without-tag-length
    languages: [typescript, javascript]
    severity: ERROR
    message: "فكّ تشفير AES-GCM بلا authTagLength يقبل وسم توثيق مقصوصاً. مرّر الخيار authTagLength بقيمة 16."
    pattern: createDecipheriv('aes-256-gcm', $KEY, $IV)
  - id: trbhh-raw-sql-interpolation
    languages: [typescript, javascript]
    severity: WARNING
    message: "استعلام خام فيه إقحام قيمة داخل النص. استخدم علامات الاستفهام والمعاملات، ولا تُقحم إلا معرّفات مُتحقَّقاً منها."
    pattern-either:
      - pattern: |
          $DB.$queryRawUnsafe(`...${$X}...`, ...)
      - pattern: |
          $DB.$executeRawUnsafe(`...${$X}...`, ...)
  - id: trbhh-dangerous-html
    languages: [typescript, javascript]
    severity: WARNING
    message: "dangerouslySetInnerHTML بقيمة غير ثابتة — تأكد أنها ليست من مُدخل مستخدم غير معقّم."
    patterns:
      - pattern: |
          <$EL ... dangerouslySetInnerHTML={{__html: $X}} ... />
      - pattern-not: |
          <$EL ... dangerouslySetInnerHTML={{__html: "..."}} ... />
  - id: trbhh-shell-exec-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: "تنفيذ أمر نظام بنص فيه إقحام قيمة — استخدم execFile أو spawn بمصفوفة معاملات."
    pattern-either:
      - pattern: |
          exec(`...${$X}...`, ...)
      - pattern: |
          execSync(`...${$X}...`, ...)
